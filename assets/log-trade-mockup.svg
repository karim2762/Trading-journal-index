    <radialGradient id="bgBlobGreen" cx="50%" cy="115%" r="55%">
      <stop offset="0%" stop-color="#12b76a" stop-opacity="0.12"/><stop offset="100%" stop-color="#12b76a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgBlobPink" cx="90%" cy="95%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.10"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#14213c" flood-opacity="0.10"/>
    </filter>
    <style>
      .f { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .disp { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
    </style>
  </defs>


