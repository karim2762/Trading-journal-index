    <radialGradient id="bgBlobPurple" cx="100%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
