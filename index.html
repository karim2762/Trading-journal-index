<style>
:root{
  --kb-offset:0px;
  --bg:#eef1f8;
  --bg-grad: none;
  --card:#ffffff;
  --card-hi:#f3f5fb;
  --card-border:#e8ebf3;
  --border:#e3e7f0;
  --blue:#2f6bff;
  --blue2:#2f6bff;
  --blue-grad:linear-gradient(135deg,#2f6bff 0%,#5b93ff 100%);
  --white-grad:linear-gradient(135deg,#f2f5ff 0%,#aab7d6 100%);
  --red:#e5484d;
  --red-dim:rgba(229,72,77,.12);
  --blue-dim:rgba(47,107,255,.12);
  --purple-dim:rgba(139,92,246,.12);
  --orange-dim:rgba(247,144,9,.14);
  --green-dim:rgba(18,183,106,.12);
  --text:#101423;
  --text-dim:#767e93;
  --text-dim2:#a4abbd;
  --radius:18px;
  --radius-sm:14px;
  --shadow: 0 2px 10px -4px rgba(20,30,60,.10);
  --purple:#8b5cf6;
  --purple-grad:linear-gradient(135deg,#8b5cf6 0%,#c084fc 100%);
  --green:#12b76a;
  --green-grad:linear-gradient(135deg,#12b76a 0%,#5fe3a1 100%);
  --orange:#f79009;
  --orange-grad:linear-gradient(135deg,#f79009 0%,#ffc069 100%);
  --pink:#ec4899;
  --pink-grad:linear-gradient(135deg,#ec4899 0%,#f9a8d4 100%);
  --cyan:#06b6d4;
  --cyan-grad:linear-gradient(135deg,#06b6d4 0%,#67e8f9 100%);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1100px 700px at 12% -10%, rgba(47,107,255,.16), transparent 60%),
    radial-gradient(900px 700px at 108% 10%, rgba(139,92,246,.14), transparent 55%),
    radial-gradient(800px 600px at 50% 120%, rgba(18,183,106,.10), transparent 55%),
    radial-gradient(700px 500px at 90% 90%, rgba(236,72,153,.08), transparent 55%),
    var(--bg);
  background-size:140% 140%,140% 140%,140% 140%,140% 140%,auto;
  background-attachment:fixed;
  animation:bgDrift 22s ease-in-out infinite alternate;
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  overscroll-behavior-y:none;
  min-height:100vh;
  padding-bottom:calc(104px + env(safe-area-inset-bottom));
}
@keyframes bgDrift{0%{background-position:0% 0%,100% 0%,50% 100%,100% 100%,0 0;}100%{background-position:10% 10%,90% 15%,45% 92%,88% 85%,0 0;}}
@media(prefers-reduced-motion:reduce){body{animation:none;}.hero::before,.hero::after{animation:none;}.hero-pill{animation:none;}}
body.no-nav{padding-bottom:calc(90px + env(safe-area-inset-bottom) + var(--kb-offset));}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
::-webkit-scrollbar{width:0;height:0;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
.spinner{animation-duration:.7s !important;}
.skeleton{position:relative;overflow:hidden;background:var(--card-hi);border-radius:8px;}
.skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
  animation:shimmer 1.3s infinite;}
@keyframes shimmer{100%{transform:translateX(100%);}}

/* ---------- App shell ---------- */
:root{--app-max:560px;}
#app{max-width:var(--app-max);margin:0 auto;position:relative;min-height:100vh;width:100%;}
@media(min-width:600px) and (max-width:859px){
  :root{--app-max:600px;}
}
@media(min-width:860px){
  body{padding-top:clamp(20px,3vw,40px);padding-bottom:calc(48px + env(safe-area-inset-bottom));}
  :root{--app-max:860px;}
  #app{min-height:auto;background:var(--card);border:1px solid var(--card-border);
    border-radius:28px;box-shadow:0 30px 70px -30px rgba(20,30,60,.35),0 2px 10px -2px rgba(20,30,60,.08);
    overflow:hidden;animation:appIn .5s cubic-bezier(.2,.8,.2,1);}
  .widget-grid{grid-template-columns:repeat(3,1fr) !important;}
  .navbar-inner{max-width:640px;}
}
@media(min-width:1120px) and (max-width:1179px){
  :root{--app-max:1040px;}
  .widget-grid{grid-template-columns:repeat(4,1fr) !important;}
  .navbar-inner{max-width:760px;}
}
@keyframes appIn{from{opacity:0;transform:translateY(14px) scale(.99);}to{opacity:1;transform:none;}}

/* ---------- Splash / onboarding ---------- */
.splash{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
.splash-inner{width:100%;max-width:1040px;display:flex;flex-direction:column;align-items:center;gap:18px;}

/* Mobile/compact brand header — hidden once the split desktop layout
   (with its own branding inside .splash-visual) takes over. */
.splash-mobile-header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;}
.splash-logo-wrap{width:88px;height:88px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px -8px rgba(47,107,255,.28);border:1px solid var(--card-border);overflow:hidden;flex-shrink:0;}
.splash-logo{width:56px;height:56px;object-fit:contain;border-radius:50%;}

.input, select.input, textarea.input{
  width:100%;background:var(--card-hi);border:1px solid var(--border);color:var(--text);
  border-radius:12px;padding:13px 14px;font-size:15px;outline:none;transition:border-color .15s, box-shadow .15s;
}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-dim);background:var(--card);}
textarea.input{resize:vertical;min-height:70px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:14px;padding:14px 18px;font-size:15px;font-weight:600;cursor:pointer;
  transition:transform .12s ease, filter .15s ease, box-shadow .15s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--blue-grad);color:#ffffff;width:100%;box-shadow:0 8px 20px -8px rgba(47,107,255,.45);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:var(--card-hi);color:var(--text);border:1px solid var(--border);}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(229,72,77,.3);}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:10px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- Header ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 4px;}
.topbar-left{display:flex;align-items:center;gap:10px;}
.topbar-logo-wrap{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--card-border);
  display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:var(--shadow);flex-shrink:0;}
.topbar-logo{width:22px;height:22px;object-fit:contain;border-radius:50%;}
.topbar-name{font-weight:700;font-family:'Space Grotesk';font-size:16px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card-hi);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);position:relative;transition:.15s;}
.icon-btn:active{transform:scale(.92);}
.icon-btn svg{width:18px;height:18px;}
.icon-btn-label{display:none;}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--blue-grad);display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#ffffff;font-size:14px;cursor:pointer;}

/* ---------- Balance hero ---------- */
.hero{margin:14px 18px 6px;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
  padding:20px;position:relative;overflow:hidden;box-shadow:var(--shadow);}
.hero::before{content:'';position:absolute;inset:0;background:
  radial-gradient(220px 140px at 90% -10%, rgba(47,107,255,.14), transparent 70%),
  radial-gradient(200px 140px at -10% 110%, rgba(139,92,246,.10), transparent 70%);
  pointer-events:none;background-size:200% 200%;animation:heroGlow 8s ease-in-out infinite;}
@keyframes heroGlow{0%,100%{background-position:0% 0%;}50%{background-position:100% 100%;}}
.hero::after{content:'';position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink),var(--orange),var(--cyan),var(--blue));
  background-size:300% 100%;animation:heroBar 6s linear infinite;}
@keyframes heroBar{0%{background-position:0% 0%;}100%{background-position:300% 0%;}}
.hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;}
.hero-label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;font-weight:600;}
.hero-balance{font-family:'Space Grotesk';font-size:34px;font-weight:700;margin-top:4px;letter-spacing:-.5px;
  background:linear-gradient(90deg,var(--text) 40%,var(--blue) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--blue-dim);color:var(--blue2);white-space:nowrap;
  animation:pillPulse 2.6s ease-in-out infinite;}
@keyframes pillPulse{0%,100%{box-shadow:0 0 0 0 rgba(47,107,255,.35);}50%{box-shadow:0 0 0 5px rgba(47,107,255,0);}}
.hero-pill.neg{background:var(--red-dim);color:var(--red);}
.hero-meta{display:flex;gap:18px;margin-top:14px;position:relative;}
.hero-meta div{font-size:12px;color:var(--text-dim);}
.hero-meta b{display:block;color:var(--text);font-size:14px;font-weight:700;margin-top:2px;}

/* ---------- Section label ---------- */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 18px 12px;}
.section-title{font-family:'Space Grotesk';font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.section-title .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue);}
.link-btn{font-size:13px;color:var(--blue2);font-weight:600;cursor:pointer;background:none;border:none;}

/* ---------- Widget grid ---------- */
.widget-grid{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-flow:dense;gap:14px;padding:0 18px 22px;align-items:start;}
.widget{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-sm);
  padding:17px 17px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow);
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  animation:widgetIn .45s cubic-bezier(.2,.8,.2,1) backwards;}
.widget::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--blue-grad);opacity:.9;border-radius:0 0 3px 3px;}
.widget:nth-child(6n+2)::before{background:var(--purple-grad);}
.widget:nth-child(6n+3)::before{background:var(--green-grad);}
.widget:nth-child(6n+4)::before{background:var(--orange-grad);}
.widget:nth-child(6n+5)::before{background:var(--pink-grad);}
.widget:nth-child(6n+6)::before{background:var(--cyan-grad);}
.widget:nth-child(1){animation-delay:.02s;}
.widget:nth-child(2){animation-delay:.06s;}
.widget:nth-child(3){animation-delay:.10s;}
.widget:nth-child(4){animation-delay:.14s;}
.widget:nth-child(5){animation-delay:.18s;}
.widget:nth-child(6){animation-delay:.22s;}
.widget:nth-child(n+7){animation-delay:.24s;}
.widget:hover{transform:translateY(-3px);box-shadow:0 14px 28px -14px rgba(20,30,60,.25);}
.widget.span2{grid-column:span 2;}
@keyframes widgetIn{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:none;}}
@media(prefers-reduced-motion:reduce){.widget{animation:none;}}
.widget-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
.widget-q{font-size:11px;color:var(--text-dim2);margin-top:1px;}
.widget-label{font-size:12px;color:var(--text-dim);font-weight:600;}
.widget-val{font-family:'Space Grotesk';font-size:22px;font-weight:700;margin-top:6px;letter-spacing:-.3px;}
.widget-val.small{font-size:17px;}
.widget-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
.widget-remove{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--red-dim);
  color:var(--red);display:none;align-items:center;justify-content:center;cursor:pointer;font-size:14px;line-height:1;border:none;}
.edit-mode .widget-remove{display:flex;}
.edit-mode .widget{border-color:rgba(229,72,77,.4);}
.widget canvas{max-height:90px;margin-top:6px;}
.widget-chart-tall canvas{max-height:130px;}
.legend-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.legend-chip{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-dim);}
.legend-chip i{width:7px;height:7px;border-radius:2px;display:inline-block;}

.add-widget-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  border:1.5px dashed var(--card-border);border-radius:var(--radius-sm);padding:22px 20px;color:var(--text-dim);
  font-size:12px;font-weight:600;cursor:pointer;grid-column:span 2;transition:.2s;background:linear-gradient(135deg,rgba(47,107,255,.04),rgba(139,92,246,.04));}
.add-widget-tile:hover{border-color:var(--blue);color:var(--blue2);transform:translateY(-2px);
  box-shadow:0 10px 24px -14px rgba(47,107,255,.4);background:linear-gradient(135deg,rgba(47,107,255,.08),rgba(139,92,246,.08));}
.add-widget-tile:active{transform:scale(.97);}
.add-widget-tile svg{width:22px;height:22px;flex-shrink:0;}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:50px 24px;color:var(--text-dim);}
.empty-icon{font-size:34px;margin-bottom:10px;opacity:.6;}
.empty h3{font-family:'Space Grotesk';color:var(--text);margin:0 0 6px;font-size:16px;}
.empty p{font-size:13px;line-height:1.5;margin:0 0 18px;}

/* ---------- Bottom nav ---------- */
.navbar{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));pointer-events:none;}
.navbar-inner{pointer-events:all;max-width:520px;width:100%;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);
  border:1px solid var(--card-border);border-radius:22px;display:flex;align-items:center;justify-content:space-around;
  padding:8px 6px;box-shadow:0 8px 28px -10px rgba(20,30,60,.18);}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-dim2);font-size:10px;
  font-weight:600;padding:6px 10px;border-radius:12px;cursor:pointer;transition:.15s;background:none;border:none;}
.nav-item svg{width:20px;height:20px;}
.nav-item.active{color:var(--blue2);}
.nav-fab{width:52px;height:52px;border-radius:50%;background:var(--blue-grad);display:flex;align-items:center;
  justify-content:center;margin-top:-26px;box-shadow:0 10px 26px -8px rgba(61,132,255,.7);cursor:pointer;border:3px solid var(--bg);
  animation:fabPulse 2.8s ease-in-out infinite;transition:transform .15s;}
@keyframes fabPulse{0%,100%{box-shadow:0 10px 26px -8px rgba(61,132,255,.7);}50%{box-shadow:0 10px 30px -4px rgba(61,132,255,.9);}}
.nav-fab svg{width:24px;height:24px;color:#ffffff;}
.nav-fab:active{transform:scale(.9);}
@media(prefers-reduced-motion:reduce){.nav-fab{animation:none;}}

/* ---------- Generic page ---------- */
.page{padding:16px 18px 60px;animation:pageIn .32s cubic-bezier(.2,.8,.2,1) both;}
@keyframes pageIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@media(prefers-reduced-motion:reduce){.page{animation:none;}}

/* ---------------- Sticky form action bar (device-friendly save) ---------------- */
.sticky-actions{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + var(--kb-offset));
  z-index:45;display:flex;justify-content:center;padding:0;pointer-events:none;
  box-shadow:0 -8px 24px -12px rgba(20,30,60,.12);}
.sticky-actions-inner{pointer-events:all;width:100%;max-width:var(--app-max);display:flex;gap:10px;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));

@media(min-width:860px){
  .sticky-actions-inner{border-radius:0 0 28px 28px;}
}
.navbar.hidden{display:none;}
.page-title{font-family:'Space Grotesk';font-size:22px;font-weight:700;margin:6px 0 4px;}
.page-sub{color:var(--text-dim);font-size:13px;margin:0 0 18px;}

/* ---------- Cards / lists ---------- */
.card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;}
.page:not(.no-card-anim) .card{animation:widgetIn .4s cubic-bezier(.2,.8,.2,1) backwards;}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--blue-grad);opacity:.85;}
.card:nth-of-type(2)::before{background:var(--purple-grad);}
.card:nth-of-type(3)::before{background:var(--green-grad);}
.card:nth-of-type(4)::before{background:var(--orange-grad);}
.card:nth-of-type(1){animation-delay:.02s;}
.card:nth-of-type(2){animation-delay:.08s;}
.card:nth-of-type(3){animation-delay:.14s;}
.card:nth-of-type(4){animation-delay:.20s;}
.trade-card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);
  animation:widgetIn .4s cubic-bezier(.2,.8,.2,1) backwards;transition:transform .15s,box-shadow .15s,border-color .15s;
  content-visibility:auto;contain-intrinsic-size:auto 78px;}
.trade-card:active{transform:scale(.97);}
@media(hover:hover){.trade-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -10px rgba(20,30,60,.22);border-color:var(--blue-dim);}}
@media(prefers-reduced-motion:reduce){.trade-card{animation:none;}}
.trade-banner{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--card-hi);flex-shrink:0;}
.trade-banner.ph{display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;color:var(--text-dim);font-size:11px;}
.trade-info{flex:1;min-width:0;}
.trade-symbol-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.trade-symbol{font-weight:700;font-size:14.5px;}
.dir-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px;}
.dir-badge.long{background:var(--blue-dim);color:var(--blue2);}
.dir-badge.short{background:var(--red-dim);color:var(--red);}
.status-tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 7px 2px 5px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px;}
.status-tag svg{width:11px;height:11px;}
.status-tag.be{background:var(--purple-dim);color:var(--purple);}
.status-tag.openstat{background:var(--orange-dim);color:var(--orange);animation:tagPulse 2s ease-in-out infinite;}
@keyframes tagPulse{0%,100%{opacity:1;}50%{opacity:.55;}}
.trade-meta{font-size:11.5px;color:var(--text-dim);margin-top:3px;}
.trade-pnl{text-align:right;flex-shrink:0;}
.trade-pnl .amt{font-family:'Space Grotesk';font-weight:700;font-size:15px;}
.trade-pnl .amt.pos{color:var(--blue2);}
.trade-pnl .amt.neg{color:var(--red);}
.trade-pnl .amt.be{color:var(--purple);}
.trade-pnl .amt.openstat{color:var(--orange);}
.trade-pnl .date{font-size:10.5px;color:var(--text-dim2);margin-top:2px;}

/* ---------- Forms ---------- */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
.form-row.three{grid-template-columns:1fr 1fr 1fr;gap:8px;}
/* A field-label already sits right above a form-row, so it doesn't need
   extra top margin. But two form-rows stacked back-to-back (e.g. Date/Time
   then Lots/Entry then Stop Loss/Take Profit) had almost no gap between
   them (2px), which made the fields look crammed together / overlapping —
   give those a proper gap instead. */
.field-label + .form-row{margin-top:6px;}
.form-row + .form-row{margin-top:18px;}
/* Each column in a form-row is its own flex column so that a taller left
   cell (e.g. a label that wraps, or a checkbox row) never pushes only the
   left input down while the right input in the same row stays put — every
   input in a row now sits on the same baseline regardless of what grows
   above/below it in its own column. */
.form-row > div{display:flex;flex-direction:column;min-width:0;}
.form-row .field-label{flex:0 0 auto;}
.toggle-group{display:flex;gap:8px;}
.toggle-opt{transition:background .18s,color .18s,border-color .18s,box-shadow .18s,transform .12s;}
.toggle-opt{flex:1;text-align:center;padding:12px 10px;border-radius:12px;border:1px solid var(--border);
  background:var(--card-hi);font-weight:700;font-size:13.5px;cursor:pointer;color:var(--text-dim);transition:.15s;}
.toggle-opt:active{transform:scale(.96);}
.on-long.active{box-shadow:0 4px 14px -6px rgba(18,183,106,.5);}
.on-short.active{box-shadow:0 4px 14px -6px rgba(229,72,77,.5);}
.toggle-opt.on-long.active{background:var(--blue-dim);border-color:var(--blue);color:var(--blue2);}
.toggle-opt.on-short.active{background:var(--red-dim);border-color:var(--red);color:var(--red);}
.toggle-opt.on-be.active{background:var(--purple-dim);border-color:var(--purple);color:var(--purple);box-shadow:0 4px 14px -6px rgba(139,92,246,.5);}
.toggle-opt.on-open.active{background:var(--orange-dim);border-color:var(--orange);color:var(--orange);box-shadow:0 4px 14px -6px rgba(247,144,9,.5);}
.toggle-opt .ticon{display:inline-flex;vertical-align:-3px;margin-right:3px;}
.toggle-opt .ticon svg{width:13px;height:13px;}
.toggle-opt.sm{padding:9px;font-size:12px;}
.na-row{display:flex;align-items:flex-start;gap:7px;margin-top:9px;margin-bottom:2px;font-size:11.5px;line-height:1.4;color:var(--text-dim);flex-wrap:wrap;}
.na-row input{accent-color:var(--blue);flex-shrink:0;margin-top:2px;}
.na-row label{cursor:pointer;}
/* A field-label with an optional trailing hint (e.g. "— saved as a win")
   used to grow the label to two lines on narrow screens and push only
   that one input down, throwing it out of line with its neighbour in the
   same form-row. The hint now renders as its own small caption UNDER the
   input instead of inline in the label, so every field-label in a row
   stays exactly one line and every input lines up. */
.field-hint{display:block;font-size:11px;font-weight:600;margin-top:6px;color:var(--text-dim2);transition:color .15s;}
.field-hint.is-win{color:var(--green);}
.field-hint.is-loss{color:var(--red);}
.field-label-row{display:flex;align-items:center;gap:6px;}
.field-label-row .fli{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:6px;flex-shrink:0;color:#fff;}
.field-label-row .fli svg{width:11px;height:11px;}
.fli-entry{background:var(--blue-grad);}
.fli-sl{background:var(--red);background:linear-gradient(135deg,#e5484d,#ff8a8f);}
.fli-tp{background:var(--green-grad);}
.fli-rr{background:var(--purple-grad);}
.fli-date{background:var(--orange-grad);}
.fli-time{background:var(--cyan-grad);}
.fli-symbol{background:var(--blue-grad);}
.fli-lots{background:linear-gradient(135deg,#6366f1,#a5b4fc);}
.fli-exit{background:var(--pink-grad);}
.fli-pnl{background:var(--green-grad);}
.fli-pnl.neg{background:linear-gradient(135deg,#e5484d,#ff8a8f);}
.fli-tags{background:var(--purple-grad);}
.fli-notes{background:linear-gradient(135deg,#64748b,#94a3b8);}
.fli-user{background:var(--blue-grad);}
.field-label-row .auto-badge{margin-left:auto;font-size:9.5px;font-weight:700;text-transform:none;letter-spacing:0;
  color:var(--blue2);background:var(--blue-dim);border:1px solid rgba(47,107,255,.35);padding:2px 7px;border-radius:8px;
  animation:autoBadgeIn .25s ease,autoBadgePulse 2.2s ease-in-out .25s infinite;}
@keyframes autoBadgeIn{from{opacity:0;transform:scale(.7);}to{opacity:1;transform:none;}}
@keyframes autoBadgePulse{0%,100%{box-shadow:0 0 0 0 rgba(47,107,255,.35);}50%{box-shadow:0 0 0 4px rgba(47,107,255,0);}}
@media(prefers-reduced-motion:reduce){.field-label-row .auto-badge{animation:none;}}
/* The active Long/Short and Win/Loss toggle pills use an outer glow to
   signal selection. On a toggle-group that sits directly above another
   row (e.g. Direction sits right above Date/Time), that glow could bleed
   down far enough to visually touch the icons in the row below. Give the
   group breathing room and rein in how far the glow spreads. */
.toggle-group{margin-bottom:4px;}
.on-long.active{box-shadow:0 3px 10px -6px rgba(18,183,106,.5);}
.on-short.active{box-shadow:0 3px 10px -6px rgba(229,72,77,.5);}
/* Colour-coded focus glow so each field feels distinct instead of every
   input flashing the same generic blue ring. */
#f-entry:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-dim);}
#f-sl:focus{border-color:var(--red);box-shadow:0 0 0 4px var(--red-dim);}
#f-tp:focus{border-color:#12b76a;box-shadow:0 0 0 4px rgba(18,183,106,.14);}
#f-rr:focus{border-color:#8b5cf6;box-shadow:0 0 0 4px rgba(139,92,246,.14);}
.date-quick{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;}
.date-chip{padding:6px 12px;border-radius:20px;font-size:11.5px;font-weight:700;border:1px solid var(--border);
  background:var(--card-hi);color:var(--text-dim);cursor:pointer;transition:.15s;}
.date-chip:active{transform:scale(.94);}
.date-chip.active{background:var(--orange-grad);border-color:transparent;color:#fff;box-shadow:0 4px 12px -5px rgba(247,144,9,.6);}
.chip-input{display:flex;flex-wrap:wrap;gap:6px;background:var(--card-hi);border:1px solid var(--border);border-radius:12px;padding:8px;}
.chip{background:var(--blue-dim);color:var(--blue2);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:8px;
  display:flex;align-items:center;gap:6px;}
.chip span{cursor:pointer;opacity:.7;}
.chip-input input{flex:1;min-width:80px;background:none;border:none;color:var(--text);outline:none;font-size:13px;padding:5px;}

.upload-box{display:block;width:100%;border:1.5px dashed var(--card-border);border-radius:var(--radius-sm);padding:26px 18px;text-align:center;
  cursor:pointer;color:var(--text-dim);position:relative;overflow:hidden;transition:.2s;
  background:linear-gradient(135deg,rgba(47,107,255,.05),rgba(139,92,246,.05));}
.upload-box:hover{border-color:var(--blue);transform:translateY(-2px);
  box-shadow:0 10px 24px -12px rgba(47,107,255,.35);background:linear-gradient(135deg,rgba(47,107,255,.09),rgba(139,92,246,.09));}
.upload-box.drag-over{border-color:var(--blue);border-style:solid;background:var(--blue-dim);transform:scale(1.01);}
.upload-box.has-image{padding:0;border-style:solid;background:none;}
.upload-box img{width:100%;border-radius:var(--radius-sm);display:block;max-height:220px;object-fit:cover;}
.upload-box .ico{margin-bottom:8px;display:inline-flex;padding:14px;border-radius:50%;
  background:var(--blue-grad);color:#fff;box-shadow:0 8px 20px -8px rgba(47,107,255,.6);animation:iconPulse 2.4s ease-in-out infinite;}
.upload-box .ico svg{width:24px;height:24px;display:block;}
.upload-box .upload-title{font-size:14px;font-weight:600;color:var(--text);margin-top:8px;}
.upload-box small{display:block;font-size:11px;margin-top:4px;color:var(--text-dim2);}
@keyframes iconPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
.upload-clear{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;transition:.15s;}
.upload-clear:hover{background:var(--red);transform:scale(1.08);}
.upload-badge{position:absolute;left:10px;bottom:10px;background:rgba(16,20,35,.65);backdrop-filter:blur(4px);
  color:#fff;font-size:11px;font-weight:600;padding:5px 10px;border-radius:20px;display:flex;align-items:center;gap:5px;}

.analyze-banner{display:flex;align-items:center;gap:10px;background:var(--blue-dim);border:1px solid rgba(61,132,255,.3);
  border-radius:12px;padding:12px;margin-top:10px;font-size:12.5px;color:var(--blue2);
  animation:bannerIn .25s ease;}
.analyze-banner.warn{background:rgba(217,140,10,.10);border-color:rgba(217,140,10,.3);color:#92600a;}
.analyze-banner.success{background:rgba(18,183,106,.10);border-color:rgba(18,183,106,.35);color:#0d8a51;}
@keyframes bannerIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(47,107,255,.2);border-top-color:var(--blue);
  animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Modal / sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(3,5,12,.65);backdrop-filter:blur(3px);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.overlay.open{opacity:1;pointer-events:all;}
.sheet{width:100%;max-width:560px;background:var(--card);border:1px solid var(--card-border);
  border-bottom:none;border-radius:24px 24px 0 0;max-height:88vh;overflow-y:auto;transform:translateY(100%);
  transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:18px 18px calc(24px + env(safe-area-inset-bottom));}
.overlay.open .sheet{transform:translateY(0);}
.sheet-handle{width:38px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 14px;}
.sheet-title{font-family:'Space Grotesk';font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.sheet-close{width:30px;height:30px;border-radius:50%;background:var(--card-hi);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:var(--text-dim);}
.sheet-search{width:100%;background:var(--card-hi);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);font-size:13.5px;margin-bottom:12px;outline:none;}
.filter-chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;}
.filter-chips::-webkit-scrollbar{display:none;}
.fchip{flex-shrink:0;padding:7px 13px;border-radius:20px;background:var(--card-hi);border:1px solid var(--border);
  font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;transition:background .18s,color .18s,border-color .18s,transform .12s;}
.fchip:active{transform:scale(.94);}
.fchip .fcicon{display:inline-flex;margin-right:4px;}
.fchip .fcicon svg{width:13px;height:13px;}
.fchip.active{background:var(--blue-dim);color:var(--blue2);border-color:var(--blue);}
.fchip.fc-win.active{background:var(--blue-dim);color:var(--blue2);border-color:var(--blue);}
.fchip.fc-loss.active{background:var(--red-dim);color:var(--red);border-color:var(--red);}
.fchip.fc-be.active{background:var(--purple-dim);color:var(--purple);border-color:var(--purple);}
.fchip.fc-open.active{background:var(--orange-dim);color:var(--orange);border-color:var(--orange);}
.cat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim2);margin:18px 0 8px 2px;}
.catalog-item{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--card-border);
  border-radius:14px;margin-bottom:9px;background:var(--card);}
.catalog-item-icon{width:38px;height:38px;border-radius:10px;background:var(--blue-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;}
.catalog-item-body{flex:1;min-width:0;}
.catalog-item-body b{font-size:13.5px;font-weight:700;}
.catalog-item-body p{font-size:11.5px;color:var(--text-dim);margin:3px 0 0;line-height:1.4;}
.catalog-add{flex-shrink:0;padding:7px 13px;border-radius:10px;font-size:12px;font-weight:700;border:none;cursor:pointer;background:var(--blue-grad);color:#ffffff;}
.catalog-add.added{background:var(--card-hi);color:var(--text-dim);}

/* ---------- Trade detail ---------- */
/* Was object-fit:cover inside a fixed 150px box, which crops tall/portrait
   banner screenshots. Wrap it in a letterboxed frame instead so the whole
   image is always visible, just placed inside a small frame. */
.detail-banner-wrap{width:100%;max-height:220px;border-radius:16px;margin-bottom:14px;
  background:var(--card-hi);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.detail-banner{width:100%;height:100%;max-height:220px;object-fit:contain;display:block;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.detail-cell{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:12px;}
.detail-cell .k{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;font-weight:700;letter-spacing:.4px;}
.detail-cell .v{font-family:'Space Grotesk';font-weight:700;font-size:16px;margin-top:4px;}

/* ---------- Calendar ---------- */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;animation:pageIn .28s cubic-bezier(.2,.8,.2,1) both;}
.cal-dow{text-align:center;font-size:10px;color:var(--text-dim2);font-weight:700;padding-bottom:4px;}
.cal-cell{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10.5px;background:var(--card-hi);color:var(--text-dim2);gap:2px;}
.cal-cell.pos{background:var(--blue-dim);color:var(--blue2);}
.cal-cell.neg{background:var(--red-dim);color:var(--red);}
.cal-cell b{font-size:11px;}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.cal-nav button{background:var(--card-hi);border:1px solid var(--border);color:var(--text);width:28px;height:28px;border-radius:8px;cursor:pointer;}

/* ---------- Table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.tbl th{text-align:left;color:var(--text-dim);font-weight:600;font-size:10.5px;text-transform:uppercase;padding:6px 4px;border-bottom:1px solid var(--border);}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--border);}
.tbl tr:last-child td{border-bottom:none;}

/* ---------- Settings ---------- */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--border);}
.set-row:last-child{border-bottom:none;}
.set-row .l b{display:block;font-size:14px;}
.set-row .l small{color:var(--text-dim);font-size:11.5px;}
.switch{width:42px;height:24px;background:var(--card-hi);border-radius:20px;position:relative;cursor:pointer;border:1px solid var(--border);flex-shrink:0;}
.switch.on{background:var(--blue-grad);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;}
.switch.on::after{left:20px;}
.storage-bar{height:8px;background:var(--card-hi);border-radius:6px;overflow:hidden;margin-top:8px;}
.storage-fill{height:100%;background:var(--blue-grad);border-radius:6px;}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:#181d2e;
  border:1px solid rgba(255,255,255,.08);color:#f4f6fb;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;
  box-shadow:var(--shadow);z-index:100;opacity:0;pointer-events:none;transition:.25s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(min-width:600px){.widget-grid{grid-template-columns:repeat(2,1fr);}}

/* ============================================================
   DESKTOP DASHBOARD SHELL — sidebar layout, colourful nav icons
   ============================================================ */
.app-layout{display:block;}
.sidebar{display:none;}
.main-col{display:block;}

.side-icon{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;color:#fff;box-shadow:0 6px 14px -6px rgba(20,30,60,.35);}
.side-icon svg{width:18px;height:18px;}
.side-icon.grad-blue{background:var(--blue-grad);}
.side-icon.grad-purple{background:var(--purple-grad);}
.side-icon.grad-green{background:var(--green-grad);}
.side-icon.grad-orange{background:var(--orange-grad);}
.side-icon.grad-pink{background:var(--pink-grad);}
.side-icon.grad-cyan{background:var(--cyan-grad);}

@media(min-width:1180px){
  /* Full-width, fluid shell — no more fixed 1180/1320px cap, so the app
     genuinely fills a Windows desktop monitor at any size instead of
     floating as a narrow box in the middle of the screen. */
  :root{--app-max:100%;--desktop-gutter:clamp(18px,2.4vw,40px);}
  html{scrollbar-gutter:stable;}
  body{padding:clamp(16px,1.8vw,32px) var(--desktop-gutter);}
  #app{max-width:none;width:100%;background:transparent;border:none;box-shadow:none;border-radius:0;overflow:visible;animation:none;}
  .app-layout{display:flex;align-items:flex-start;gap:clamp(16px,1.6vw,28px);width:100%;}

  .sidebar{display:flex;flex-direction:column;width:clamp(228px,15vw,300px);flex-shrink:0;position:sticky;
    top:clamp(16px,1.8vw,32px);height:calc(100vh - clamp(32px,3.6vw,64px));background:var(--card);
    border:1px solid var(--card-border);border-radius:24px;padding:22px 16px;
    box-shadow:0 30px 70px -35px rgba(20,30,60,.35),0 2px 10px -2px rgba(20,30,60,.08);overflow-y:auto;}
  .sidebar-brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px;}
  .sidebar-brand img{width:34px;height:34px;border-radius:9px;}
  .sidebar-brand .sb-name{font-family:'Space Grotesk';font-weight:700;font-size:17px;}
  .sidebar-brand .sb-sub{font-size:10.5px;color:var(--text-dim2);font-weight:600;letter-spacing:.02em;}

  .side-section-label{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
    color:var(--text-dim2);padding:16px 12px 7px;}
  /* Nav rows are noticeably bigger and clearer on desktop: taller click
     target, larger label text, visible focus ring for keyboard/mouse use. */
  .side-nav-item{display:flex !important;flex-direction:row !important;align-items:center;gap:12px;
    width:100%;padding:12px 12px;border-radius:14px;font-size:14.5px;font-weight:600;color:var(--text-dim);
    background:transparent;border:1px solid transparent;cursor:pointer;transition:.15s;text-align:left;}
  .side-nav-item span.side-label{flex:1;}
  .side-nav-item:hover{background:var(--card-hi);}
  .side-nav-item:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  .side-nav-item.active{background:var(--blue-dim);border-color:rgba(47,107,255,.25);color:var(--blue2);}
  .side-nav-item.active .side-icon{box-shadow:0 8px 18px -6px rgba(47,107,255,.55);}
  .side-badge-soon{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.03em;color:var(--purple);
    background:var(--purple-dim);border-radius:99px;padding:3px 8px;flex-shrink:0;}
  .side-nav-item.side-soon{color:var(--text-dim2);cursor:not-allowed;}

  .sidebar-cta{margin:16px 2px 8px;display:flex !important;flex-direction:row !important;align-items:center;
    justify-content:center;gap:9px;padding:15px 16px;border-radius:14px;border:none;cursor:pointer;
    background:var(--blue-grad);color:#fff;font-weight:700;font-size:14.5px;
    box-shadow:0 10px 22px -8px rgba(47,107,255,.6);transition:filter .15s,transform .12s;}
  .sidebar-cta:hover{filter:brightness(1.08);}
  .sidebar-cta:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  .sidebar-cta:active{transform:scale(.97);}
  .sidebar-cta svg{width:17px;height:17px;}

  .sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid var(--border);display:flex;
    align-items:center;gap:11px;}
  .sidebar-footer .avatar{width:36px;height:36px;font-size:14px;}
  .sidebar-footer .sf-name{font-size:13.5px;font-weight:700;}
  .sidebar-footer .sf-tag{font-size:10.5px;color:var(--text-dim2);font-weight:600;}

  .navbar{display:none;}
  .main-col{flex:1;min-width:0;width:100%;background:var(--card);border:1px solid var(--card-border);
    border-radius:24px;overflow:hidden;box-shadow:0 30px 70px -35px rgba(20,30,60,.35),0 2px 10px -2px rgba(20,30,60,.08);}
  .topbar{padding:22px var(--desktop-gutter);border-bottom:1px solid var(--border);}
  .topbar-name{font-size:19px;}
  .topbar-right{gap:14px;}
  /* Icon buttons grow a text label on desktop instead of staying a bare
     unlabeled circle — clearer at a glance, still one click. */
  .icon-btn{width:auto;height:44px;min-width:44px;border-radius:22px;padding:0 18px 0 15px;gap:9px;
    font-size:13.5px;font-weight:700;transition:.15s;}
  .icon-btn:hover{background:var(--blue-dim);color:var(--blue2);border-color:rgba(47,107,255,.3);}
  .icon-btn svg{width:19px;height:19px;}
  .icon-btn-label{display:inline;white-space:nowrap;}
  .avatar{width:44px;height:44px;font-size:15px;transition:filter .15s;}
  .avatar:hover{filter:brightness(1.1);}

  #route-outlet{padding:6px 8px;}
  .page{padding-left:var(--desktop-gutter);padding-right:var(--desktop-gutter);}
  /* Widget grid adds columns as the window grows instead of jumping
     between fixed 3/4-column breakpoints, so it fills whatever width a
     given Windows monitor has (1366, 1920, 2560, ultrawide, ...). */
  .widget-grid{padding:0 var(--desktop-gutter) 30px;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr)) !important;}
  .widget{padding:20px 20px 18px;transition:transform .18s ease, box-shadow .18s ease;}
  .widget:hover{transform:translateY(-3px);box-shadow:0 22px 40px -20px rgba(20,30,60,.28);}
  .widget-val{font-size:24px;}
  .add-widget-tile{grid-column:span 1;}

  /* Bigger, clearer buttons and controls throughout — larger tap targets,
     visible hover state, and a real pointer cursor everywhere clickable. */
  .btn{padding:14px 24px;font-size:15px;border-radius:14px;}
  .btn:hover{filter:brightness(1.06);}
  .btn-ghost:hover{background:var(--border);}
  .btn-sm{padding:10px 16px;font-size:13.5px;}
  button,.nav-item,.side-nav-item,.icon-btn,.avatar,.chip span,.fchip,.toggle-opt,.date-chip,
  .catalog-add,.sheet-close,.cal-nav button,.widget-remove,.upload-clear,.link-btn,.switch,
  .add-widget-tile,.upload-box{cursor:pointer;}
  .fchip{padding:9px 16px;font-size:13px;}
  .toggle-opt{padding:15px 12px;font-size:14.5px;}
  .date-chip{padding:8px 15px;font-size:12.5px;}
  .card{padding:20px;}
  .trade-card{padding:16px;gap:15px;}
  .cal-nav button{width:34px;height:34px;}
  .switch{width:46px;height:26px;}
  .switch::after{width:20px;height:20px;}
  .switch.on::after{left:22px;}

  .sticky-actions-inner{max-width:640px;border-radius:0 0 24px 24px;}

  .detail-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));}
}

@media(min-width:1600px){
  .sidebar{width:300px;}
  .widget-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr)) !important;}
}

@media(min-width:1920px){
  :root{--desktop-gutter:48px;}
  body{padding:48px var(--desktop-gutter);}
  .main-col{border-radius:28px;}
}
</style>

<script>
/* =========================================================================
   WAVEPOINT — Trading Journal
   Single-file SPA. IndexedDB storage. No build step.
   ========================================================================= */

/* ---------------- IndexedDB layer ---------------- */
const DB_NAME = 'wavepoint_db', DB_VER = 1;
let _dbP = null;
function openDB(){
  if(_dbP) return _dbP;
  _dbP = new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('profile')) db.createObjectStore('profile',{keyPath:'id'});
      if(!db.objectStoreNames.contains('trades')){
        const s = db.createObjectStore('trades',{keyPath:'id',autoIncrement:true});
        s.createIndex('date','date');
      }
      if(!db.objectStoreNames.contains('widgets')) db.createObjectStore('widgets',{keyPath:'id'});
      if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings',{keyPath:'id'});
    };
    req.onsuccess = (e)=>resolve(e.target.result);
    req.onerror = (e)=>reject(e.target.error);
  });
  return _dbP;
}
async function tx(store, mode, fn){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const t = db.transaction(store, mode);
    const os = t.objectStore(store);
    const out = fn(os);
    t.oncomplete = ()=>resolve(out && out.__result !== undefined ? out.__result : out);
    t.onerror = ()=>reject(t.error);
  });
}
function reqToPromise(req){
  return new Promise((res,rej)=>{ req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); });
}
async function dbGetAll(store){
  const db = await openDB();
  const t = db.transaction(store,'readonly');
  return reqToPromise(t.objectStore(store).getAll());
}
async function dbGet(store, key){
  const db = await openDB();
  const t = db.transaction(store,'readonly');
  return reqToPromise(t.objectStore(store).get(key));
}
async function dbPut(store, val){
  const db = await openDB();
  const t = db.transaction(store,'readwrite');
  return reqToPromise(t.objectStore(store).put(val));
}
async function dbDelete(store, key){
  const db = await openDB();
  const t = db.transaction(store,'readwrite');
  return reqToPromise(t.objectStore(store).delete(key));
}
async function dbClearAll(){
  const db = await openDB();
  const stores = ['profile','trades','widgets','settings'];
  await Promise.all(stores.map(s=>{
    const t = db.transaction(s,'readwrite');
    return reqToPromise(t.objectStore(s).clear());
  }));
}

/* ---------------- Global state ---------------- */
const S = {
  profile: null,
  trades: [],
  widgets: [],
  settings: null,
  route: 'dashboard',
  editMode: false,
  charts: {},           // active Chart.js instances, keyed by canvas id
  calMonth: new Date(),
  dashCalMonth: new Date(),
  historyFilter: 'all',
  draftTrade: null,     // in-progress log-trade form state
  detailTradeId: null,
};

/* ---------------- Utils ---------------- */
const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>[...root.querySelectorAll(sel)];
function fmtMoney(n, withSign){
  if(n===null||n===undefined||isNaN(n)) return '—';
  const sign = n<0 ? '-' : (withSign && n>0 ? '+' : '');
  return sign + '$' + Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtCompact(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  const abs = Math.abs(n);
  if(abs>=1000000) return (n/1000000).toFixed(2)+'M';
  if(abs>=1000) return (n/1000).toFixed(1)+'K';
  return n.toFixed(2);
}
function fmtPct(n,d=1){ if(n===null||n===undefined||isNaN(n)) return '—'; return n.toFixed(d)+'%'; }
function fmtDate(d){
  const dt = new Date(d);
  return dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function fmtDateShort(d){
  const dt = new Date(d);
  return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toast(msg){
  let el = $('.toast');
  if(!el){ el = document.createElement('div'); el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 2200);
}
function fileToDataURL(file, maxDim=1280){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let {width,height} = img;
        if(width>maxDim || height>maxDim){
          const scale = maxDim/Math.max(width,height);
          width = Math.round(width*scale); height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- Analytics engine ---------------- */
function closedTrades(){ return S.trades.filter(t=>t.status!=='open').sort((a,b)=>new Date(a.date)-new Date(b.date)); }
function allSorted(){ return [...S.trades].sort((a,b)=>new Date(b.date)-new Date(a.date) || (b.id-a.id)); }

// computeStats() does a full pass over every trade (sorts, filters, reduces,
// builds the equity curve, month/weekday/session breakdowns...) and used to
// re-run from scratch every single time it was called — 2-3x per page for
// Dashboard/Analysis, since the render function and the chart-mount function
// each call it independently. None of that work changes between those calls
// (same trade list, same starting balance), so it's cached here and only
// recomputed when the trades array or starting balance actually changes.
// This is a pure performance win — it doesn't touch what gets rendered or
// any animation/effect, just how many times the same numbers get crunched.
let _statsCache = null, _statsCacheTrades = null, _statsCacheBal = null;
function computeStats(){
  const bal = (S.profile && S.profile.startingBalance) || 0;
  if(_statsCache && _statsCacheTrades===S.trades && _statsCacheBal===bal) return _statsCache;
  _statsCache = computeStatsRaw();
  _statsCacheTrades = S.trades;
  _statsCacheBal = bal;
  return _statsCache;
}
function computeStatsRaw(){
  const trades = closedTrades();
  const wins = trades.filter(t=>t.pnl>0);
  const losses = trades.filter(t=>t.pnl<0);
  const totalPnl = trades.reduce((s,t)=>s+(Number(t.pnl)||0),0);
  const startBal = (S.profile && S.profile.startingBalance) || 0;
  const currentBalance = startBal + totalPnl;
  const winRate = trades.length ? (wins.length/trades.length*100) : 0;
  const avgWin = wins.length ? wins.reduce((s,t)=>s+t.pnl,0)/wins.length : 0;
  const avgLoss = losses.length ? Math.abs(losses.reduce((s,t)=>s+t.pnl,0)/losses.length) : 0;
  const grossWin = wins.reduce((s,t)=>s+t.pnl,0);
  const grossLoss = Math.abs(losses.reduce((s,t)=>s+t.pnl,0));
  const profitFactor = grossLoss>0 ? grossWin/grossLoss : (grossWin>0?Infinity:0);
  const expectancy = trades.length ? totalPnl/trades.length : 0;

  // equity curve + drawdown
  let running = startBal, peak = startBal, maxDD = 0, maxDDPct=0;
  const curve = [{x:'Start', y:startBal}];
  trades.forEach(t=>{
    running += (Number(t.pnl)||0);
    peak = Math.max(peak, running);
    const dd = peak - running;
    if(dd>maxDD){ maxDD = dd; maxDDPct = peak>0? (dd/peak*100) : 0; }
    curve.push({x:fmtDateShort(t.date), y:running});
  });

  // streaks
  let curStreak=0, curType=null, bestWin=0, worstLoss=0;
  trades.forEach(t=>{
    const type = t.pnl>0?'win':(t.pnl<0?'loss':'be');
    if(type===curType){ curStreak++; } else { curStreak=1; curType=type; }
    if(type==='win') bestWin=Math.max(bestWin,curStreak);
    if(type==='loss') worstLoss=Math.max(worstLoss,curStreak);
  });

  // by symbol
  const bySymbol = {};
  trades.forEach(t=>{
    const k = (t.symbol||'—').toUpperCase();
    bySymbol[k] = bySymbol[k] || {symbol:k, count:0, pnl:0, wins:0};
    bySymbol[k].count++; bySymbol[k].pnl += t.pnl; if(t.pnl>0) bySymbol[k].wins++;
  });

  // by weekday
  const wdNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const byWeekday = wdNames.map(n=>({label:n,pnl:0,count:0}));
  trades.forEach(t=>{ const d=new Date(t.date).getDay(); byWeekday[d].pnl+=t.pnl; byWeekday[d].count++; });

  // by hour
  const byHour = Array.from({length:24},(_,h)=>({label:h,pnl:0,count:0}));
  trades.forEach(t=>{
    if(t.time){ const h = parseInt(t.time.split(':')[0]); if(!isNaN(h)){ byHour[h].pnl+=t.pnl; byHour[h].count++; } }
  });

  // by month
  const byMonth = {};
  trades.forEach(t=>{
    const d = new Date(t.date);
    const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    byMonth[k] = byMonth[k] || {label:d.toLocaleDateString(undefined,{month:'short'}), pnl:0};
    byMonth[k].pnl += t.pnl;
  });

  // by day (calendar map date-> pnl)
  const byDay = {};
  trades.forEach(t=>{
    const k = new Date(t.date).toDateString();
    byDay[k] = (byDay[k]||0) + t.pnl;
  });

  // long vs short
  const longs = trades.filter(t=>t.direction==='long');
  const shorts = trades.filter(t=>t.direction==='short');
  const longPnl = longs.reduce((s,t)=>s+t.pnl,0);
  const shortPnl = shorts.reduce((s,t)=>s+t.pnl,0);

  // avg RR
  const rrTrades = trades.filter(t=>t.rr);
  const avgRR = rrTrades.length ? rrTrades.reduce((s,t)=>s+Number(t.rr),0)/rrTrades.length : 0;

  // avg hold time (minutes) if both date+time and exitTime exist -- approximate using duration field
  const durTrades = trades.filter(t=>t.durationMin);
  const avgDuration = durTrades.length ? durTrades.reduce((s,t)=>s+Number(t.durationMin),0)/durTrades.length : null;

  const largestWin = wins.length ? Math.max(...wins.map(t=>t.pnl)) : 0;
  const largestLoss = losses.length ? Math.min(...losses.map(t=>t.pnl)) : 0;

  // day-level streaks (best consecutive winning days / worst consecutive losing days)
  const dayEntries = Object.entries(byDay).sort((a,b)=>new Date(a[0])-new Date(b[0]));
  let dCurStreak=0, dCurType=null, bestWinDays=0, worstLossDays=0;
  dayEntries.forEach(([,pnl])=>{
    const type = pnl>0?'win':(pnl<0?'loss':'be');
    if(type===dCurType){ dCurStreak++; } else { dCurStreak=1; dCurType=type; }
    if(type==='win') bestWinDays=Math.max(bestWinDays,dCurStreak);
    if(type==='loss') worstLossDays=Math.max(worstLossDays,dCurStreak);
  });
  const winDays = dayEntries.filter(([,p])=>p>0).map(([,p])=>p);
  const lossDays = dayEntries.filter(([,p])=>p<0).map(([,p])=>p);
  const avgWinDay = winDays.length ? winDays.reduce((s,p)=>s+p,0)/winDays.length : 0;
  const avgLossDay = lossDays.length ? Math.abs(lossDays.reduce((s,p)=>s+p,0)/lossDays.length) : 0;

  // trading sessions (UTC hour buckets, standard FX session windows)
  const sessionDefs = [
    {name:'Sydney', start:21, end:6},
    {name:'Tokyo', start:0, end:9},
    {name:'London', start:7, end:16},
    {name:'New York', start:12, end:21},
  ];
  const inRange = (h,start,end)=> start<end ? (h>=start && h<end) : (h>=start || h<end);
  const bySession = {};
  sessionDefs.forEach(s=>bySession[s.name]={session:s.name, pnl:0, count:0, wins:0});
  trades.forEach(t=>{
    if(!t.time) return;
    const h = parseInt(t.time.split(':')[0]); if(isNaN(h)) return;
    sessionDefs.forEach(s=>{
      if(inRange(h, s.start, s.end)){
        bySession[s.name].pnl += t.pnl; bySession[s.name].count++;
        if(t.pnl>0) bySession[s.name].wins++;
      }
    });
  });

  return {
    trades, wins, losses, totalPnl, startBal, currentBalance, winRate, avgWin, avgLoss,
    profitFactor, expectancy, curve, maxDD, maxDDPct, bestWin, worstLoss, bySymbol,
    byWeekday, byHour, byMonth, byDay, longPnl, shortPnl, longs, shorts, avgRR,
    avgDuration, largestWin, largestLoss, openTrades: S.trades.filter(t=>t.status==='open'),
    bestWinDays, worstLossDays, avgWinDay, avgLossDay, bySession,
  };
}

/* ---------------- Chart helpers (self-contained canvas 2D — no external library, works fully offline) ---------------- */
function destroyChart(id){ if(S.charts[id]){ cancelAnimationFrame(S.charts[id]); delete S.charts[id]; } }
function chartsReady(){ return true; }
function hexAlpha(hex,a){
  const c = hex.replace('#','');
  const r = parseInt(c.substring(0,2),16), g = parseInt(c.substring(2,4),16), b = parseInt(c.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function prepCanvas(el){
  const rect = el.getBoundingClientRect();
  // Prefer the actual container width (the box the chart must fit inside).
  // Falling back to rect.width first is wrong: before the canvas has been
  // sized once, its rect.width is the browser's default intrinsic canvas
  // width (300px), which is wider than most cards/columns — that made the
  // Win Rate donut (and any chart in a half-width card) render wider than
  // its box and get clipped, so the ring looked cut off / overflowing.
  const parentWidth = el.parentElement ? el.parentElement.clientWidth : 0;
  const w = (parentWidth || rect.width || 280);
  const h = Math.max(rect.height, 90) || 90;
  const dpr = Math.min(window.devicePixelRatio||1, 2.5);
  el.width = Math.round(w*dpr); el.height = Math.round(h*dpr);
  el.style.width = w+'px'; el.style.height = h+'px';
  const ctx = el.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return { ctx, w, h };
}
function runAnim(canvasId, draw){
  destroyChart(canvasId);
  const start = performance.now(), dur = 600;
  function frame(now){
    const t = Math.min(1,(now-start)/dur);
    draw(easeOutCubic(t));
    if(t<1) S.charts[canvasId] = requestAnimationFrame(frame);
  }
  S.charts[canvasId] = requestAnimationFrame(frame);
}
function lineChart(canvasId, points, color, fill){
  const el = document.getElementById(canvasId); if(!el) return;
  if(!points || points.length<2){ ctxEmpty(el); return; }
  const {ctx,w,h} = prepCanvas(el);
  const pad = 6;
  const ys = points.map(p=>p.y);
  let min = Math.min(...ys), max = Math.max(...ys);
  if(min===max){ min-=1; max+=1; }
  const xAt = i => pad + (i/(points.length-1))*(w-pad*2);
  const yAt = v => h-pad - ((v-min)/(max-min))*(h-pad*2);
  runAnim(canvasId, prog=>{
    ctx.clearRect(0,0,w,h);
    const n = Math.max(2, Math.round(points.length*prog));
    const pts = points.slice(0,n).map((p,i)=>({x:xAt(i), y:yAt(p.y)}));
    if(pts.length<2) return;
    if(fill){
      const grad = ctx.createLinearGradient(0,0,0,h);
      grad.addColorStop(0, hexAlpha(color,.30));
      grad.addColorStop(1, hexAlpha(color,.02));
      ctx.beginPath();
      ctx.moveTo(pts[0].x, h-pad);
      pts.forEach(p=>ctx.lineTo(p.x,p.y));
      ctx.lineTo(pts[pts.length-1].x, h-pad);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
    }
    ctx.beginPath();
    pts.forEach((p,i)=> i? ctx.lineTo(p.x,p.y): ctx.moveTo(p.x,p.y));
    ctx.strokeStyle = color; ctx.lineWidth = 2.25; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.stroke();
    // endpoint dot
    const last = pts[pts.length-1];
    ctx.beginPath(); ctx.arc(last.x,last.y,3.5,0,Math.PI*2);
    ctx.fillStyle = color; ctx.fill();
    ctx.beginPath(); ctx.arc(last.x,last.y,6,0,Math.PI*2);
    ctx.strokeStyle = hexAlpha(color,.35); ctx.lineWidth=2; ctx.stroke();
  });
}
function doughnut(canvasId, data, colors){
  const el = document.getElementById(canvasId); if(!el) return;
  const total = data.reduce((s,v)=>s+v,0);
  if(!total){ ctxEmpty(el); return; }
  const {ctx,w,h} = prepCanvas(el);
  const cx=w/2, cy=h/2, r=Math.min(w,h)/2-3, rin=r*0.72;
  destroyChart(canvasId);
  ctx.clearRect(0,0,w,h);
  let start = -Math.PI/2;
  data.forEach((v,i)=>{
    if(!v) return;
    const sweep = (v/total)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,r,start,start+sweep);
    ctx.arc(cx,cy,rin,start+sweep,start,true);
    ctx.closePath();
    ctx.fillStyle = colors[i%colors.length];
    ctx.fill();
    start += sweep;
  });
}
function gauge(canvasId, data, colors){
  const el = document.getElementById(canvasId); if(!el) return;
  const total = data.reduce((s,v)=>s+v,0);
  if(!total){ ctxEmpty(el); return; }
  const {ctx,w,h} = prepCanvas(el);
  const cx=w/2, cy=h*0.92, r=Math.min(w/2,h)-4, rin=r*0.72;
  destroyChart(canvasId);
  ctx.clearRect(0,0,w,h);
  let start = Math.PI; // left
  data.forEach((v,i)=>{
    if(!v) return;
    const sweep = (v/total)*Math.PI;
    ctx.beginPath();
    ctx.arc(cx,cy,r,start,start+sweep);
    ctx.arc(cx,cy,rin,start+sweep,start,true);
    ctx.closePath();
    ctx.fillStyle = colors[i%colors.length];
    ctx.fill();
    start += sweep;
  });
}
function barChartSigned(canvasId, labels, values){
  const el = document.getElementById(canvasId); if(!el) return;
  if(!values || !values.length){ ctxEmpty(el); return; }
  const {ctx,w,h} = prepCanvas(el);
  const pad = 6;
  const max = Math.max(1, ...values.map(v=>Math.abs(v)));
  const n = values.length;
  const maxBw = 42;
  const availW = w-pad*2;
  const gap = n>1 ? Math.min(14, availW/n*0.35) : 0;
  let bw = Math.min(maxBw, (availW-gap*(n-1))/n);
  bw = Math.max(6, bw);
  const rowW = bw*n + gap*(n-1);
  const offset = pad + Math.max(0,(availW-rowW)/2);
  const zero = h/2;
  runAnim(canvasId, prog=>{
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle = 'rgba(120,130,160,.22)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,zero); ctx.lineTo(w,zero); ctx.stroke();
    values.forEach((v,i)=>{
      const x = offset + i*(bw+gap);
      const bh = Math.abs(v)/max * (h/2-pad) * prog;
      const y = v>=0 ? zero-bh : zero;
      ctx.fillStyle = v>=0 ? '#3d84ff' : '#ff5470';
      const rr = Math.min(6, bw/2);
      roundRect(ctx, x, y, bw, Math.max(bh,1), rr);
      ctx.fill();
    });
  });
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function ctxEmpty(el){
  const div = document.createElement('div');
  div.className = 'widget-sub';
  div.style.marginTop = '10px';
  div.textContent = 'Not enough data yet';
  el.replaceWith(div);
}
function renderMiniCalendar(elId, st){
  const el = document.getElementById(elId); if(!el) return;
  const year = S.dashCalMonth.getFullYear(), month = S.dashCalMonth.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const dow = ['S','M','T','W','T','F','S'];
  let html = `<div class="cal-grid">` + dow.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startOffset;i++) html += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(year,month,d);
    const pnl = st.byDay[dt.toDateString()];
    let cls = '';
    if(pnl!==undefined) cls = pnl>=0 ? 'pos':'neg';
    const pct = (pnl!==undefined && st.startBal) ? (pnl/st.startBal*100) : null;
    html += `<div class="cal-cell ${cls}"><span>${d}</span>${pnl!==undefined?`<b>${pnl>=0?'+':''}${Math.round(pnl)}</b>${pct!==null?`<small style="font-size:8.5px;">${pct>=0?'+':''}${pct.toFixed(2)}%</small>`:''}`:''}</div>`;
  }
  html += `</div>`;
  el.innerHTML = html;
}

function fmtCountdown(hoursLeft){
  const totalMin = Math.max(0, Math.round(hoursLeft*60));
  const h = Math.floor(totalMin/60), m = totalMin%60;
  if(h<=0) return `${m}m`;
  return `${h}h ${m}m`;
}
function renderSessionClock(elId){
  const el = document.getElementById(elId); if(!el) return;
  const sessions = [
    {name:'Sydney', start:21, end:6, color:'#3d84ff'},
    {name:'Tokyo', start:0, end:9, color:'#ff5470'},
    {name:'London', start:7, end:16, color:'#8b7bff'},
    {name:'New York', start:12, end:21, color:'#3ddc97'},
  ];
  const draw = ()=>{
    if(!document.body.contains(el)){ clearInterval(el._clockTimer); return; }
    const now = new Date();
    const utcH = now.getUTCHours() + now.getUTCMinutes()/60 + now.getUTCSeconds()/3600;
    const isActive = (s)=> s.start<s.end ? (utcH>=s.start && utcH<s.end) : (utcH>=s.start || utcH<s.end);
    const barSeg = (s)=>{
      if(s.start<s.end) return `left:${s.start/24*100}%;width:${(s.end-s.start)/24*100}%;`;
      return `left:0%;width:${s.end/24*100}%;`; // wraps — simplified single segment for display
    };
    // hours remaining until this session's next transition (close if active, open if not)
    const hoursUntil = (s)=>{
      if(isActive(s)){
        const end = s.start<s.end ? s.end : (utcH>=s.start ? s.end+24 : s.end);
        return end - utcH;
      }
      const start = s.start<s.end ? (utcH<s.start ? s.start : s.start+24) : (utcH>=s.end && utcH<s.start ? s.start : (utcH<s.end ? s.start-24 : s.start));
      let diff = start - utcH;
      if(diff<0) diff += 24;
      return diff;
    };
    const activeCount = sessions.filter(isActive).length;
    let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="font-size:10px;color:var(--text-dim2);">${String(now.getUTCHours()).padStart(2,'0')}:${String(now.getUTCMinutes()).padStart(2,'0')} UTC</div>
        <div style="font-size:10px;font-weight:700;color:${activeCount?'var(--green)':'var(--text-dim2)'};display:flex;align-items:center;gap:5px;">
          ${activeCount ? `<span style="width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(18,183,106,.18);"></span>${activeCount} session${activeCount>1?'s':''} open` : 'All sessions closed'}
        </div>
      </div>`;
    sessions.forEach(s=>{
      const active = isActive(s);
      const left = fmtCountdown(hoursUntil(s));
      html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;">
        <div style="width:66px;flex-shrink:0;font-size:10.5px;line-height:1.2;font-weight:${active?'700':'600'};color:${active?'var(--text)':'var(--text-dim)'};">${s.name}</div>
        <div style="flex:1;position:relative;height:8px;background:var(--card-hi);border-radius:6px;">
          <div style="position:absolute;top:0;bottom:0;border-radius:6px;background:${s.color};opacity:${active?1:.35};${barSeg(s)}"></div>
          <div style="position:absolute;top:-3px;left:${utcH/24*100}%;width:2px;height:14px;background:var(--text-dim2);"></div>
        </div>
        <div style="width:82px;flex-shrink:0;text-align:right;font-size:9.5px;font-weight:600;color:${active?s.color:'var(--text-dim2)'};white-space:nowrap;">${active?'closes in ':'opens in '}${left}</div>
      </div>`;
    });
    el.innerHTML = html;
  };
  clearInterval(el._clockTimer);
  draw();
  el._clockTimer = setInterval(draw, 30000);
}

/* ---------------- App bootstrap ---------------- */
async function boot(){
  S.profile = await dbGet('profile', 1);
  S.settings = await dbGet('settings', 1);
  if(!S.settings){ S.settings = { id:1, backendUrl:'', currency:'USD' }; await dbPut('settings', S.settings); }
  S.trades = await dbGetAll('trades');
  let widgetRows = await dbGetAll('widgets');
  if(!widgetRows.length){
    widgetRows = WIDGET_CATALOG.filter(w=>w.def).map((w,i)=>({id:w.id, order:i}));
    for(const w of widgetRows) await dbPut('widgets', w);
  }
  S.widgets = widgetRows.sort((a,b)=>a.order-b.order);
  render();

function bindDashboard(){
  $('#btn-edit-dash').addEventListener('click', ()=>{ S.editMode = !S.editMode; renderRoute(); });
  const addBtn = $('#btn-add-widget'); if(addBtn) addBtn.addEventListener('click', openWidgetCatalog);
  $$('[data-remove]').forEach(b=>b.addEventListener('click', async (e)=>{
    e.stopPropagation();
    const id = b.dataset.remove;
    S.widgets = S.widgets.filter(w=>w.id!==id);
    await dbDelete('widgets', id);
    renderRoute();
  }));
  const firstTradeBtn = $('#btn-first-trade');
  if(firstTradeBtn) firstTradeBtn.addEventListener('click', ()=>{ S.route='log'; renderRoute(); });
  $$('[data-calnav]').forEach(b=>b.addEventListener('click', (e)=>{
    e.preventDefault();
    e.stopPropagation();
    e.currentTarget.blur();
    const dir = b.dataset.calnav==='prev' ? -1 : 1;
    S.dashCalMonth = new Date(S.dashCalMonth.getFullYear(), S.dashCalMonth.getMonth()+dir, 1);
    // Update just this widget in place instead of calling renderRoute(),
    // which used to re-render the entire dashboard (every widget, hero,
    // balance, etc.) and jump the page back to the top on every click —
    // that's the "whole dashboard refreshes" behaviour being reported.
    const label = $('#dash-cal-month-label');
    if(label) label.textContent = S.dashCalMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'});
    renderMiniCalendar('wc-calendar', computeStats());
  }));
}
function mountDashboardCharts(){
  const st = computeStats();
  S.widgets.forEach(w=>{ const def = widgetById(w.id); if(def && def.chart) def.chart(st); });
}
function openWidgetCatalog(){
  const activeIds = new Set(S.widgets.map(w=>w.id));
  const cats = [...new Set(WIDGET_CATALOG.map(w=>w.cat))];
  const renderList = (filterCat='All', q='')=>{
    let items = WIDGET_CATALOG;
    if(filterCat!=='All') items = items.filter(w=>w.cat===filterCat);
    if(q) items = items.filter(w=>w.name.toLowerCase().includes(q.toLowerCase()) || w.q.toLowerCase().includes(q.toLowerCase()));
    return items.map(w=>`
      <div class="catalog-item">
        <div class="catalog-item-icon">📈</div>
        <div class="catalog-item-body"><b>${w.name}</b><p>${w.q}</p></div>
        <button class="catalog-add ${activeIds.has(w.id)?'added':''}" data-add="${w.id}" ${activeIds.has(w.id)?'disabled':''}>${activeIds.has(w.id)?'Added':'Add'}</button>
      </div>`).join('') || `<div class="empty"><p>No widgets match.</p></div>`;
  };
  openSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">Widget Catalogue <button class="sheet-close" id="sheet-close">${svgIcon('close')}</button></div>
    <input class="sheet-search" id="cat-search" placeholder="Search widgets or questions...">
    <div class="filter-chips" id="cat-chips">
      <div class="fchip active" data-cat="All">All ${WIDGET_CATALOG.length}</div>
      ${cats.map(c=>`<div class="fchip" data-cat="${c}">${c} ${WIDGET_CATALOG.filter(w=>w.cat===c).length}</div>`).join('')}
    </div>
    <div id="cat-list">${renderList()}</div>
  `);
  $('#sheet-close').addEventListener('click', closeSheet);
  $('#global-overlay').addEventListener('click', (e)=>{ if(e.target.id==='global-overlay') closeSheet(); });
  let curCat = 'All';
  const refresh = ()=>{ $('#cat-list').innerHTML = renderList(curCat, $('#cat-search').value); bindAddButtons(); };
  const bindAddButtons = ()=>{
    $$('[data-add]').forEach(b=>b.addEventListener('click', async ()=>{
      const id = b.dataset.add;
      S.widgets.push({id, order:S.widgets.length});
      await dbPut('widgets', {id, order:S.widgets.length-1});
      activeIds.add(id);
      S.editMode = true;
      refresh();
      renderRoute();
    }));
  };
  $$('#cat-chips .fchip').forEach(c=>c.addEventListener('click', ()=>{
    curCat = c.dataset.cat;
    $$('#cat-chips .fchip').forEach(x=>x.classList.toggle('active', x===c));
    refresh();
  }));
  $('#cat-search').addEventListener('input', refresh);
  bindAddButtons();
}
