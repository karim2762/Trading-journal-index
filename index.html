        ${(!d.exitManual && !d.exitNA && d.status!=='open' && d.exit!=='') ? `<span class="auto-badge" id="exit-auto-badge">auto</span>` : ''}
      </div>
      <input class="input" type="number" step="any" id="f-exit" placeholder="0.00" value="${d.exit}" ${d.exitNA?'disabled':''}>
      <div class="na-row"><input type="checkbox" id="f-exitna" ${d.exitNA?'checked':''}><label for="f-exitna">N/A — trade still open</label></div>

      <div class="field-label field-label-row"><span class="fli fli-tags" style="background:var(--orange-grad);">${svgIcon('flag')}</span>Result</div>
      <div class="toggle-group">
        <div class="toggle-opt sm on-long ${d.status==='win'?'active':''}" data-status="win"><span class="ticon">${svgIcon('trophy')}</span>Win</div>
        <div class="toggle-opt sm on-short ${d.status==='loss'?'active':''}" data-status="loss"><span class="ticon">${svgIcon('close')}</span>Loss</div>
        <div class="toggle-opt sm on-be ${d.status==='breakeven'?'active':''}" data-status="breakeven"><span class="ticon">${svgIcon('equal')}</span>B/E</div>
        <div class="toggle-opt sm on-open ${d.status==='open'?'active':''}" data-status="open"><span class="ticon">${svgIcon('hourglass')}</span>Open</div>
      </div>

      <div class="form-row" style="margin-top:14px;">
        <div>
          <div class="field-label field-label-row">
            <span class="fli fli-pnl ${parseFloat(d.pnl)<0?'neg':''}">${svgIcon('dollar')}</span>P&L Amount ($)
            ${(!d.pnlManual && d.pnl!=='' && d.status!=='open') ? `<span class="auto-badge" id="pnl-auto-badge">auto</span>` : ''}
          </div>
          <input class="input" type="number" step="any" id="f-pnl" placeholder="e.g +150$" value="${d.pnl}" ${d.status==='open'?'disabled':''}>
          <span class="field-hint ${d.status==='win'?'is-win':d.status==='loss'?'is-loss':''}">${d.status==='loss'?'Saved as a loss':d.status==='win'?'Saved as a win':'\u00A0'}</span>
        </div>
        <div>
          <div class="field-label field-label-row"><span class="fli fli-rr">${svgIcon('ratio')}</span>Risk/Reward</div>
          <input class="input" type="number" step="any" id="f-rr" placeholder="e.g. 2.5" value="${d.rr}">
          <span class="field-hint">\u00A0</span>
        </div>
      </div>

      <div class="field-label field-label-row"><span class="fli fli-tags">${svgIcon('tag')}</span>Strategy tags</div>
      <div class="chip-input" id="tag-input-wrap">
        ${d.tags.map(t=>`<div class="chip">${t}<span data-tagrm="${t}">✕</span></div>`).join('')}
        <input type="text" id="f-tag" placeholder="Add tag, press Enter">
      </div>

      <div class="field-label field-label-row"><span class="fli fli-notes">${svgIcon('pencil')}</span>Notes</div>
      <textarea class="input" id="f-notes" placeholder="What was your setup, mindset, lessons learned...">${d.notes}</textarea>
    </div>

    <div style="height:96px;"></div>
  </div>
  <div class="sticky-actions"><div class="sticky-actions-inner">
    <button class="btn btn-ghost" id="btn-cancel-log" style="flex:1;">Cancel</button>
    <button class="btn btn-primary" id="btn-save-log" style="flex:2;">Save Trade</button>
  </div></div>`;
}
function bindLogTrade(){
  const d = S.draftTrade;
  const refresh = ()=>{ d._formRendered = true; $('#route-outlet').innerHTML = renderLogTrade(); bindLogTrade(); };

  $('#calc-upload').addEventListener('click', (e)=>{ if(e.target.closest('#clear-calc')) return; $('#calc-file').click(); });
  $('#calc-file').addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    d.calcImage = await fileToDataURL(file, 1400);
    refresh();
    runAnalyze();
  });
  const clearCalc = $('#clear-calc'); if(clearCalc) clearCalc.addEventListener('click',(e)=>{ e.preventDefault(); e.stopPropagation(); d.calcImage=null; refresh(); });
  const calcBox = $('#calc-upload');
  ['dragenter','dragover'].forEach(ev=>calcBox.addEventListener(ev,(e)=>{ e.preventDefault(); e.stopPropagation(); calcBox.classList.add('drag-over'); }));
  ['dragleave','dragend'].forEach(ev=>calcBox.addEventListener(ev,(e)=>{ e.preventDefault(); e.stopPropagation(); calcBox.classList.remove('drag-over'); }));
  calcBox.addEventListener('drop', async (e)=>{
    e.preventDefault(); e.stopPropagation(); calcBox.classList.remove('drag-over');
    const file = e.dataTransfer.files && e.dataTransfer.files[0]; if(!file || !file.type.startsWith('image/')) return;
    d.calcImage = await fileToDataURL(file, 1400);
    refresh();
    runAnalyze();
  });

  $('#banner-upload').addEventListener('click', (e)=>{ if(e.target.closest('#clear-banner')) return; $('#banner-file').click(); });
  $('#banner-file').addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    d.bannerImage = await fileToDataURL(file, 1400);
    refresh();
  });
  const clearBanner = $('#clear-banner'); if(clearBanner) clearBanner.addEventListener('click',(e)=>{ e.preventDefault(); e.stopPropagation(); d.bannerImage=null; refresh(); });
  const bannerBox = $('#banner-upload');
  ['dragenter','dragover'].forEach(ev=>bannerBox.addEventListener(ev,(e)=>{ e.preventDefault(); e.stopPropagation(); bannerBox.classList.add('drag-over'); }));
  ['dragleave','dragend'].forEach(ev=>bannerBox.addEventListener(ev,(e)=>{ e.preventDefault(); e.stopPropagation(); bannerBox.classList.remove('drag-over'); }));
  bannerBox.addEventListener('drop', async (e)=>{
    e.preventDefault(); e.stopPropagation(); bannerBox.classList.remove('drag-over');
    const file = e.dataTransfer.files && e.dataTransfer.files[0]; if(!file || !file.type.startsWith('image/')) return;
    d.bannerImage = await fileToDataURL(file, 1400);
    refresh();
  });

  if(d.calcImage) renderAnalyzeArea('idle');

  $$('.toggle-opt[data-dir]').forEach(b=>b.addEventListener('click', ()=>{ d.direction=b.dataset.dir; autoPNL(); refresh(); }));
  $$('.toggle-opt[data-status]').forEach(b=>b.addEventListener('click', ()=>{
    d.status=b.dataset.status;
    d.statusManual=true; // user picked this explicitly — stop auto-syncing it from the computed P&L
    // keep the P&L sign in sync with the selected result so a mistyped sign can't flip win/loss stats
    if(d.pnl!==''){
      const mag = Math.abs(parseFloat(d.pnl))||0;
      if(d.status==='win') d.pnl = mag;
      else if(d.status==='loss') d.pnl = -mag;
    }
    // Keep the Exit Price "N/A" checkbox in sync with the chosen result:
    // Open trades have no exit yet, everything else (Win/Loss/B-E) is exited.
    if(d.status==='open'){ d.exitNA = true; d.exit=''; }
    else { d.exitNA = false; autoExit(); autoPNL(); }
    refresh();
  }));

  $('#f-symbol').addEventListener('input', e=>{ d.symbol=e.target.value; autoPNL(); });
  $('#f-date').addEventListener('input', e=>{ d.date=e.target.value; refresh(); });
  $('#f-time').addEventListener('input', e=>d.time=e.target.value);
  $$('[data-quickdate]').forEach(el=>el.addEventListener('click', ()=>{
    d.date = el.dataset.quickdate==='today' ? todayISO() : yesterdayISO();
    refresh();
  }));
  const quickTime = $('[data-quicktime]');
  if(quickTime) quickTime.addEventListener('click', ()=>{
    d.time = new Date().toTimeString().slice(0,5);
    refresh();
  });
  $('#f-lots').addEventListener('input', e=>{ d.lots=e.target.value; autoPNL(); });
  $('#f-entry').addEventListener('input', e=>{ d.entry=e.target.value; autoRR(); autoExit(); autoPNL(); });
  $('#f-sl').addEventListener('input', e=>{ d.sl=e.target.value; autoRR(); autoExit(); });
  $('#f-tp').addEventListener('input', e=>{ d.tp=e.target.value; autoRR(); autoExit(); });
  $('#f-exit').addEventListener('input', e=>{ d.exit=e.target.value; d.exitManual=true; updateExitAutoBadge(); autoPNL(); });
  $('#f-pnl').addEventListener('input', e=>{ d.pnl=e.target.value; d.pnlManual=true; hideAutoBadge(); });
  $('#f-rr').addEventListener('input', e=>d.rr=e.target.value);
  $('#f-notes').addEventListener('input', e=>d.notes=e.target.value);

  $('#f-slna').addEventListener('change', e=>{ d.slNA=e.target.checked; if(d.slNA) d.sl=''; else autoExit(); refresh(); });
  $('#f-tpna').addEventListener('change', e=>{ d.tpNA=e.target.checked; if(d.tpNA) d.tp=''; else autoExit(); refresh(); });
  $('#f-exitna').addEventListener('change', e=>{ d.exitNA=e.target.checked; if(d.exitNA) d.exit=''; else { d.exitManual=false; autoExit(); } autoPNL(); refresh(); });

  // Setting .value directly (rather than calling refresh(), which rebuilds
  // the whole form's innerHTML) keeps the field the user is actively
  // typing in focused, while still live-updating the derived read-only-ish
  // fields (R:R, P&L) next to it as they type.
  function setDom(id, val){ const el=$(id); if(el) el.value = val; }
  function hideAutoBadge(){ const b=$('#pnl-auto-badge'); if(b) b.remove(); }
  function updateAutoBadge(){
    const labelRow = $('#f-pnl') && $('#f-pnl').previousElementSibling;
    if(!labelRow || !labelRow.classList.contains('field-label-row')) return;
    let badge = $('#pnl-auto-badge');
    const shouldShow = !d.pnlManual && d.pnl!=='' && d.status!=='open';
    if(shouldShow && !badge){
      badge = document.createElement('span');
      badge.id = 'pnl-auto-badge'; badge.className='auto-badge'; badge.textContent='auto';
      labelRow.appendChild(badge);
    } else if(!shouldShow && badge){
      badge.remove();
    }
  }
  function updateExitAutoBadge(){
    const labelRow = $('#f-exit-label');
    if(!labelRow) return;
    let badge = $('#exit-auto-badge');
    const shouldShow = !d.exitManual && !d.exitNA && d.status!=='open' && d.exit!=='';
    if(shouldShow && !badge){
      badge = document.createElement('span');
      badge.id = 'exit-auto-badge'; badge.className='auto-badge'; badge.textContent='auto';
      labelRow.appendChild(badge);
    } else if(!shouldShow && badge){
      badge.remove();
    }
  }

  // Derives the Exit Price straight from the trade's result, the same way
  // a real closed trade works: a Win exits at Take Profit, a Loss exits at
  // Stop Loss, and a Break-even exits back at Entry. This only fills the
  // field in — it never fights the user: as soon as they type into Exit
  // Price directly it's flagged "manual" (see the #f-exit input handler)
  // and this stops overwriting it, exactly like the P&L auto-calc above.
  function autoExit(){
    if(d.exitManual || d.exitNA || d.status==='open') return;
    let val = '';
    if(d.status==='win' && !d.tpNA && d.tp!=='') val = d.tp;
    else if(d.status==='loss' && !d.slNA && d.sl!=='') val = d.sl;
    else if(d.status==='breakeven' && d.entry!=='') val = d.entry;
    if(val!==''){
      d.exit = val;
      setDom('#f-exit', d.exit);
      autoPNL();
    }
    updateExitAutoBadge();
  }

  function autoRR(){
    const entry=parseFloat(d.entry), sl=parseFloat(d.sl), tp=parseFloat(d.tp);
    if(!isNaN(entry) && !isNaN(sl) && !isNaN(tp) && entry!==sl){
      d.rr = (Math.abs(tp-entry)/Math.abs(entry-sl)).toFixed(2);
      setDom('#f-rr', d.rr);
    }
  }

  // Auto-calculates P&L from Entry, Exit and Lots/Size whenever all three
  // are known — the user never has to do the math by hand. As soon as the
  // user types directly into the P&L field it's flagged "manual" and this
  // stops overwriting it. If there isn't enough info yet (no exit price,
  // or no lot size), the field is simply left blank so it's obvious it
  // still needs a manual entry.
  function contractMultiplier(symbol){
    const s = (symbol||'').toUpperCase().replace(/[^A-Z]/g,'');
    // Crypto tickers are usually quoted/sized in whole coins, so "lots"
    // there means literal quantity — no multiplier.
    const cryptoPrefixes = ['BTC','ETH','XRP','SOL','DOGE','LTC','BNB','ADA','AVAX','DOT','MATIC','LINK'];
    if(cryptoPrefixes.some(p=>s.startsWith(p))) return 1;
    // Standard 6-letter FX/metal pairs (EURUSD, GBPJPY, XAUUSD, XAGUSD...)
    // are traded in 100,000-unit standard lots, so a 0.0014 price move on
    // 0.8 lots is a real $112, not $0.001 — this is just a heuristic and
    // the user can always type over it manually.
    if(/^[A-Z]{6}$/.test(s)) return 100000;
    return 1; // stocks/indices/other: treat "lots" as literal unit quantity
  }
  function autoPNL(){
    if(d.pnlManual || d.status==='open') return;
    const entry=parseFloat(d.entry), exit=parseFloat(d.exit), lots=parseFloat(d.lots);
    if(!isNaN(entry) && !isNaN(exit) && !isNaN(lots) && lots>0){
      const diff = d.direction==='short' ? (entry-exit) : (exit-entry);
      const mult = contractMultiplier(d.symbol);
      d.pnl = (diff*lots*mult).toFixed(2);
      // Keep the Win/Loss/B-E result in sync with the *sign* of the P&L we just
      // computed — unless the user has explicitly picked a result themselves.
      // Previously the result stayed stuck on the default "Win" no matter what
      // Entry/Exit worked out to, and saveTrade() forces the P&L sign to match
      // whatever the result says — so every auto-filled losing trade (negative
      // diff) was silently getting saved as a positive-P&L win.
      if(!d.statusManual){
        const p = parseFloat(d.pnl);
        d.status = p>0 ? 'win' : p<0 ? 'loss' : 'breakeven';
        updateStatusToggle();
      }
    } else {
      d.pnl = '';
    }
    setDom('#f-pnl', d.pnl);
    const fli = $('.fli-pnl');
    if(fli) fli.classList.toggle('neg', parseFloat(d.pnl)<0);
    updateAutoBadge();
  }
  // Live-updates the Win/Loss/B-E/Open toggle buttons and the "Saved as a
  // win/loss" hint without doing a full refresh() (which would blow away
  // whatever field the user is mid-typing in).
  function updateStatusToggle(){
    $$('.toggle-opt[data-status]').forEach(b=>{
      b.classList.toggle('active', b.dataset.status===d.status);
    });
    const hint = $('#f-pnl') && $('#f-pnl').parentElement && $('#f-pnl').parentElement.querySelector('.field-hint');
    if(hint){
      hint.classList.toggle('is-win', d.status==='win');
      hint.classList.toggle('is-loss', d.status==='loss');
      hint.textContent = d.status==='loss' ? 'Saved as a loss' : d.status==='win' ? 'Saved as a win' : '\u00A0';
    }
    const exitNaBox = $('#f-exitna');
    if(exitNaBox && d.status==='open' && !exitNaBox.checked){ exitNaBox.checked = true; }
  }

  const tagInput = $('#f-tag');
  tagInput.addEventListener('keydown', e=>{
    if(e.key==='Enter' && tagInput.value.trim()){
      e.preventDefault();
      d.tags.push(tagInput.value.trim());
      refresh();
    }
  });
  $$('[data-tagrm]').forEach(el=>el.addEventListener('click', ()=>{
    d.tags = d.tags.filter(t=>t!==el.dataset.tagrm);
    refresh();
  }));

  $('#btn-cancel-log').addEventListener('click', ()=>{
    S.draftTrade = null; S.route='dashboard'; renderRoute();
  });
  $('#btn-save-log').addEventListener('click', saveTrade);

  async function runAnalyze(){
    if(!S.settings.backendUrl){
      renderAnalyzeArea('nobackend');
      return;
    }
    renderAnalyzeArea('loading');
    try{
      const blob = await (await fetch(d.calcImage)).blob();
      const fd = new FormData();
      fd.append('file', blob, 'calc.jpg');
      const res = await fetch(S.settings.backendUrl.replace(/\/$/,'') + '/extract', { method:'POST', body:fd });
      if(!res.ok) throw new Error('Backend error '+res.status);
      const json = await res.json();
      if(json.entry_price!=null) d.entry = json.entry_price;
      if(json.stop_loss!=null){ d.sl = json.stop_loss; d.slNA=false; }
      if(json.take_profit!=null){ d.tp = json.take_profit; d.tpNA=false; }
      // Exit price wasn't being read from the backend response at all before —
      // if the calculator screenshot / OCR result includes a closed/exit
      // price, pick it up and enable the field automatically instead of
      // leaving the user to type it in by hand. This counts as a "given"
      // value (like a manual entry) so the Win/Loss/B-E-based auto-exit
      // below never overwrites what the backend actually read.
      if(json.exit_price!=null || json.exit!=null || json.close_price!=null){
        d.exit = json.exit_price ?? json.exit ?? json.close_price;
        d.exitNA = false;
        d.exitManual = true;
      } else if(!d.exitNA && d.status!=='open'){
        // Backend didn't report an exit — derive it from the result
        // (Win→TP, Loss→SL, B/E→Entry) using whatever SL/TP/Entry it did read.
        d.exitManual = false;
        autoExit();
      }
      if(json.risk_reward_ratio!=null) d.rr = json.risk_reward_ratio;
      if(json.direction) d.direction = json.direction;
      // Lots/Size and P&L are intentionally NOT auto-filled from the backend
      // — OCR'd position size and P&L are unreliable, so both fields are
      // left blank here. The user enters the lot size themselves and P&L
      // is then auto-calculated from Entry/Exit/Lots (see autoPNL()); if
      // there still isn't enough info to calculate it, it just stays blank
      // for manual entry.
      // Fallback: if the backend didn't report a risk/reward ratio but we
      // do have entry/SL/TP, derive it the same way manual entry does —
      // this covers cases where the OCR read the price levels fine but
      // missed/misread the "Risk/reward ratio:" line specifically.
      if((d.rr===''||d.rr==null) && d.entry!=='' && d.sl!=='' && d.tp!==''){
        const entryN=parseFloat(d.entry), slN=parseFloat(d.sl), tpN=parseFloat(d.tp);
        if(!isNaN(entryN) && !isNaN(slN) && !isNaN(tpN) && entryN!==slN){
          d.rr = (Math.abs(tpN-entryN)/Math.abs(entryN-slN)).toFixed(2);
        }
      }
      autoPNL();
      renderAnalyzeArea('success', json.warnings);
      // Patch the changed fields in place instead of calling refresh().
      // refresh() replaces the whole form's innerHTML, which re-creates
      // every .card element and replays its slide-in animation -- that's
      // what caused fields (like Risk/Reward) to visibly "jump" every
      // time a screenshot was analyzed. Updating values directly avoids
      // the reflow/reanimate entirely.
      const setVal = (id, val) => { const el = $(id); if(el && val!=null) el.value = val; };
      setVal('#f-entry', d.entry);
      setVal('#f-sl', d.sl);
      setVal('#f-tp', d.tp);
      setVal('#f-exit', d.exit);
      setVal('#f-rr', d.rr);
      const slNaBox = $('#f-slna'); if(slNaBox) slNaBox.checked = !!d.slNA;
      const tpNaBox = $('#f-tpna'); if(tpNaBox) tpNaBox.checked = !!d.tpNA;
      const exitNaBox = $('#f-exitna'); if(exitNaBox) exitNaBox.checked = !!d.exitNA;
      const slInput = $('#f-sl'); if(slInput) slInput.disabled = !!d.slNA;
      const tpInput = $('#f-tp'); if(tpInput) tpInput.disabled = !!d.tpNA;
      const exitInput = $('#f-exit'); if(exitInput) exitInput.disabled = !!d.exitNA;
      updateExitAutoBadge();
      if(json.direction){
        $$('.toggle-opt[data-dir]').forEach(b=>b.classList.toggle('active', b.dataset.dir===d.direction));
      }
    }catch(err){
      renderAnalyzeArea('error', [err.message]);
    }
  }
  window._runAnalyze = runAnalyze;
}
function renderAnalyzeArea(state, warnings){
  const el = $('#analyze-area'); if(!el) return;
  if(state==='idle'){
    el.innerHTML = `<div class="analyze-banner"><span>${svgIcon('wand')}</span>Screenshot added. <button class="link-btn" style="color:var(--blue2)" onclick="window._runAnalyze && window._runAnalyze()">Analyze now</button></div>`;
  } else if(state==='loading'){
    el.innerHTML = `<div class="analyze-banner"><div class="spinner"></div>Reading your chart...</div>`;
  } else if(state==='nobackend'){
    el.innerHTML = `<div class="analyze-banner warn">⚠️ No analysis backend connected yet. Fill fields manually below, or add your backend URL in Settings to auto-fill next time.</div>`;
  } else if(state==='success'){
    el.innerHTML = `<div class="analyze-banner success">${svgIcon('check')} Auto-filled from your screenshot. Double-check the values below and adjust anything before saving.${warnings&&warnings.length?'<br><span style="color:var(--text-dim)">'+warnings.join(' ')+'</span>':''}</div>`;
  } else if(state==='error'){
    el.innerHTML = `<div class="analyze-banner warn">⚠️ Couldn't auto-read this screenshot (${(warnings&&warnings[0])||'unknown error'}). No problem — just fill in the fields manually below.</div>`;
  }
}
async function saveTrade(){
  const d = S.draftTrade;
  if(!d.symbol.trim()){ toast('Enter a symbol'); return; }
  if(!d.entry){ toast('Enter an entry price'); return; }
  if(d.status!=='open' && d.pnl===''){ toast('Enter the P&L amount, or mark as Open'); return; }
  // normalize P&L sign to match the selected result — a Loss is always stored negative and a Win
  // is always stored positive, no matter which sign was typed into the amount field.
  let pnlVal = parseFloat(d.pnl||0);
  if(d.status==='win') pnlVal = Math.abs(pnlVal);
  else if(d.status==='loss') pnlVal = -Math.abs(pnlVal);
  const trade = {
    date: d.date, time: d.time, symbol: d.symbol.trim().toUpperCase(), direction: d.direction,
    lots: d.lots?parseFloat(d.lots):null, entry: parseFloat(d.entry),
    sl: d.slNA? null : (d.sl?parseFloat(d.sl):null),
    tp: d.tpNA? null : (d.tp?parseFloat(d.tp):null),
    exit: d.exitNA? null : (d.exit?parseFloat(d.exit):null),
    status: d.status, pnl: d.status==='open'? 0 : pnlVal,
    rr: d.rr?parseFloat(d.rr):null, tags: d.tags, notes: d.notes,
    // The calculator screenshot is only used to auto-fill the form above —
    // it's never persisted to storage (it would just bloat the database
    // with duplicate chart images). The banner image, which the user
    // explicitly wants shown in their journal, is kept.
    calcImage: null, bannerImage: d.bannerImage, durationMin: d.durationMin?parseFloat(d.durationMin):null,
    createdAt: new Date().toISOString(),
  };
  if(d.editingId){
    trade.id = d.editingId;
    await dbPut('trades', trade);
    S.trades = S.trades.map(x=>x.id===trade.id ? trade : x);
    toast('Trade updated');
  } else {
    const id = await dbPut('trades', trade);
    trade.id = id;
    S.trades = [...S.trades, trade];
    toast('Trade saved');
  }
  S.draftTrade = null;
  S.route = 'history';
  renderRoute();
}

/* ---------------- History / Journal ---------------- */
function renderHistory(){
  let trades = allSorted();
  if(S.historyFilter==='win') trades = trades.filter(t=>t.pnl>0 && t.status!=='open');
  else if(S.historyFilter==='loss') trades = trades.filter(t=>t.pnl<0 && t.status!=='open');
  else if(S.historyFilter==='breakeven') trades = trades.filter(t=>t.status==='breakeven');
  else if(S.historyFilter==='open') trades = trades.filter(t=>t.status==='open');

  const rows = trades.map((t,i)=>{
    const amtClass = t.status==='open' ? 'openstat' : t.status==='breakeven' ? 'be' : (t.pnl>=0?'pos':'neg');
    const statusTag = t.status==='open'
      ? `<span class="status-tag openstat">${svgIcon('hourglass')}Open</span>`
      : t.status==='breakeven'
        ? `<span class="status-tag be">${svgIcon('equal')}B/E</span>`
        : '';
    return `
    <div class="trade-card" data-tid="${t.id}" style="animation-delay:${Math.min(i*.04,.4)}s">
      ${t.bannerImage ? `<img src="${t.bannerImage}" class="trade-banner" loading="lazy" decoding="async">` : `<div class="trade-banner ph">${t.symbol.slice(0,4)}</div>`}
      <div class="trade-info">
        <div class="trade-symbol-row"><span class="trade-symbol">${t.symbol}</span><span class="dir-badge ${t.direction}">${t.direction}</span>${statusTag}</div>
        <div class="trade-meta">${t.lots?t.lots+' lots · ':''}${fmtDate(t.date)}</div>
      </div>
      <div class="trade-pnl">
        <div class="amt ${amtClass}">${t.status==='open'?'—':fmtMoney(t.pnl,true)}</div>
        <div class="date">${t.rr?t.rr+'R':''}</div>
      </div>
    </div>`;}).join('');

  return `
  <div class="page">
    <div class="page-title">Journal</div>
    <div class="page-sub">${S.trades.length} trade${S.trades.length===1?'':'s'} logged</div>
    <div class="filter-chips">
      <div class="fchip ${S.historyFilter==='all'?'active':''}" data-f="all"><span class="fcicon">${svgIcon('layers')}</span>All</div>
      <div class="fchip fc-win ${S.historyFilter==='win'?'active':''}" data-f="win"><span class="fcicon">${svgIcon('trophy')}</span>Wins</div>
      <div class="fchip fc-loss ${S.historyFilter==='loss'?'active':''}" data-f="loss"><span class="fcicon">${svgIcon('close')}</span>Losses</div>
      <div class="fchip fc-be ${S.historyFilter==='breakeven'?'active':''}" data-f="breakeven"><span class="fcicon">${svgIcon('equal')}</span>B/E</div>
      <div class="fchip fc-open ${S.historyFilter==='open'?'active':''}" data-f="open"><span class="fcicon">${svgIcon('hourglass')}</span>Open</div>
    </div>
    ${rows || `<div class="empty"><div class="empty-icon">📓</div><h3>No trades here yet</h3><p>Tap the + button to log your first trade.</p></div>`}
  </div>`;
}
function bindHistory(){

  $$('.trade-card').forEach(c=>c.addEventListener('click', ()=>{ S.detailTradeId = parseInt(c.dataset.tid); openTradeDetail(); }));

function bindAnalysis(){
  const prev = $('#cal-prev'), next=$('#cal-next');
  const goto = (delta)=>(e)=>{
    // Stop default button behaviour and immediately drop focus so the
    // browser can't scroll the page to keep the (about to move/resize)
    // button in view — this was causing the page to jump to the top and
    // then snap back whenever the month was changed.
    e.preventDefault();
    e.currentTarget.blur();
    S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth()+delta, 1);
    renderAnalysisCalendar();
  };
  if(prev) prev.addEventListener('click', goto(-1));
  if(next) next.addEventListener('click', goto(1));
}
function renderAnalysisCalendar(){
  const st = computeStats();
  const label = $('#cal-month-label');
  if(label) label.textContent = S.calMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const el = $('#an-calendar'); if(!el) return;
  const year = S.calMonth.getFullYear(), month = S.calMonth.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const dow = ['S','M','T','W','T','F','S'];
  let html = `<div class="cal-grid">` + dow.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startOffset;i++) html += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(year,month,d);
    const pnl = st.byDay[dt.toDateString()];
    let cls = pnl!==undefined ? (pnl>=0?'pos':'neg') : '';
    html += `<div class="cal-cell ${cls}"><span>${d}</span>${pnl!==undefined?`<b>${pnl>=0?'+':''}${Math.round(pnl)}</b>`:''}</div>`;
  }
  html += `</div>`;
  el.innerHTML = html;
}
function mountAnalysisCharts(){
  const st = computeStats();

  barChartSigned('an-weekday', st.byWeekday.map(d=>d.label), st.byWeekday.map(d=>d.pnl));

}

    });
  }
}
async function buildBackupPayload(){
  const trades = await dbGetAll('trades');

    profile:S.profile, settings:S.settings, trades, widgets };
}
async function exportData(){
  const payload = await buildBackupPayload();

  const a = document.createElement('a');
  a.href = url; a.download = `trading-journal-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();

  red:    [0.898,0.282,0.302],   // #e5484d
  green:  [0.071,0.718,0.416],   // #12b76a
  purple: [0.545,0.361,0.965],   // #8b5cf6
  text:   [0.063,0.078,0.137],   // #101423
  dim:    [0.463,0.494,0.576],   // #767e93
  dim2:   [0.643,0.671,0.741],   // #a4abbd
  border: [0.890,0.906,0.945],   // #e3e7f0
  hi:     [0.953,0.961,0.984],   // #f3f5fb
  white:  [1,1,1],
  blueDim:[0.902,0.925,1.000],
  redDim: [0.976,0.914,0.918],
};

function pdfSanitizeText(str){
  if(str===null||str===undefined) return '';
  let s = String(str)
    .replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"')
    .replace(/\u2013|\u2014/g,'-').replace(/\u2026/g,'...');
  let out = '';
  for(const ch of s){
    const code = ch.codePointAt(0);
    if(code===9){ out+=' '; continue; }
    if(code<32) continue;
    out += code>255 ? '?' : ch;
  }
  return out;
}
function pdfLiteral(str){
  return str.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
}
function pdfDataUrlToBytes(dataUrl){
  const b64 = dataUrl.split(',')[1] || '';
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function pdfJpegSize(bytes){
  let i = 2; // skip SOI (FFD8)
  while(i < bytes.length){
    if(bytes[i] !== 0xFF) { i++; continue; }
    const marker = bytes[i+1];
    if(marker===0xD8||marker===0x01||(marker>=0xD0&&marker<=0xD7)){ i+=2; continue; }
    if(marker===0xD9) break; // EOI
    const len = (bytes[i+2]<<8) | bytes[i+3];
    const isSOF = (marker>=0xC0 && marker<=0xCF) && marker!==0xC4 && marker!==0xC8 && marker!==0xCC;
    if(isSOF){
      const height = (bytes[i+5]<<8) | bytes[i+6];
      const width  = (bytes[i+7]<<8) | bytes[i+8];
      return { width, height };
    }
    i += 2 + len;
  }
  return { width:800, height:600 }; // fallback, shouldn't normally hit
}

function createPDFDoc(){
  const objects = [];
  let nextNum = 1;
  function newObj(){ const num = nextNum++; objects.push({num, data:null}); return num; }
  function setObj(num, data){
    const o = objects.find(o=>o.num===num);
    o.data = Array.isArray(data) ? data : [data];
  }
  const fontRegular = newObj();
  const fontBold = newObj();
  setObj(fontRegular, `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`);
  setObj(fontBold, `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`);
  const resourcesNum = newObj();

  const images = []; // {num,name}
  function addImage(dataUrl){
    const bytes = pdfDataUrlToBytes(dataUrl);
    const {width,height} = pdfJpegSize(bytes);
    const num = newObj();
    const header = `<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`;
    setObj(num, [header, bytes, `\nendstream`]);
    const name = 'Im'+num;
    images.push({num,name});
    return { name, width, height };
  }

  const pages = [];
  function newPage(){
    const contentNum = newObj();
    const pageNum = newObj();
    const page = { pageNum, contentNum, ops:[], n: pages.length+1 };
    pages.push(page);
    return page;
  }

  function build(){
    const fontsDict = `/F1 ${fontRegular} 0 R /F2 ${fontBold} 0 R`;
    const xobjDict = images.map(im=>`/${im.name} ${im.num} 0 R`).join(' ');
    setObj(resourcesNum, `<< /Font << ${fontsDict} >> /XObject << ${xobjDict} >> /ProcSet [/PDF /Text /ImageC] >>`);
    const pagesObjNum = newObj();
    const catalogNum = newObj();
    setObj(pagesObjNum, `<< /Type /Pages /Kids [ ${pages.map(p=>`${p.pageNum} 0 R`).join(' ')} ] /Count ${pages.length} >>`);
    setObj(catalogNum, `<< /Type /Catalog /Pages ${pagesObjNum} 0 R >>`);
    pages.forEach(p=>{
      const contentBytes = new TextEncoder().encode(p.ops.join('\n'));
      setObj(p.contentNum, [`<< /Length ${contentBytes.length} >>\nstream\n`, contentBytes, `\nendstream`]);
      setObj(p.pageNum, `<< /Type /Page /Parent ${pagesObjNum} 0 R /MediaBox [0 0 ${PDF_A4.w} ${PDF_A4.h}] /Resources ${resourcesNum} 0 R /Contents ${p.contentNum} 0 R >>`);
    });

    const parts = []; let offset = 0; const offsets = {};
    function push(chunk){
      if(typeof chunk==='string'){ const b=new TextEncoder().encode(chunk); parts.push(b); offset+=b.length; }
      else { parts.push(chunk); offset+=chunk.length; }
    }
    push('%PDF-1.4\n');
    const sorted = objects.slice().sort((a,b)=>a.num-b.num);
    sorted.forEach(o=>{
      offsets[o.num] = offset;
      push(`${o.num} 0 obj\n`);
      o.data.forEach(push);
      push(`\nendobj\n`);
    });
    const xrefStart = offset;
    const maxNum = sorted[sorted.length-1].num;
    push(`xref\n0 ${maxNum+1}\n0000000000 65535 f \n`);
    for(let n=1;n<=maxNum;n++){
      const off = offsets[n];
      push(off===undefined ? `0000000000 00000 f \n` : `${String(off).padStart(10,'0')} 00000 n \n`);
    }
    push(`trailer\n<< /Size ${maxNum+1} /Root ${catalogNum} 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);
    return new Blob(parts, {type:'application/pdf'});
  }

  return { newPage, addImage, build };
}

async function exportPDF(){
  const btn = $('#btn-export-pdf');
  const trades = allSorted().slice().reverse(); // chronological, oldest first, for the report
  if(!trades.length){ toast('No trades to export yet'); return; }
  if(btn){ btn.disabled = true; btn.textContent = 'Generating PDF…'; }
  // Let the UI paint the "generating" state before the (synchronous) build runs.
  await new Promise(r=>setTimeout(r, 30));
  try{
    const blob = buildTradesPDF(trades);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `trading-journal-${new Date().toISOString().slice(0,10)}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('PDF exported');
  }catch(err){
    console.error(err);
    toast('PDF export failed: '+err.message);
  }finally{
    if(btn){ btn.disabled = false; btn.innerHTML = `${svgIcon('download')} Export PDF`; }
  }
}

function buildTradesPDF(trades){
  const st = computeStats();
  const doc = createPDFDoc();
  const M = 48; // page margin
  const W = PDF_A4.w - M*2;
  const measure = document.createElement('canvas').getContext('2d');
  function textW(text, size, bold){
    measure.font = `${bold?'700 ':''}${size}px Helvetica, Arial, sans-serif`;
    return measure.measureText(text).width;
  }
  function wrap(text, maxW, size, bold){
    const out = [];
    pdfSanitizeText(text).split(/\n/).forEach(para=>{
      if(!para){ out.push(''); return; }
      const words = para.split(/\s+/).filter(Boolean);
      let cur = '';
      words.forEach(word=>{
        const test = cur ? cur+' '+word : word;
        if(textW(test,size,bold) > maxW && cur){ out.push(cur); cur = word; }
        else cur = test;
      });
      if(cur) out.push(cur);
    });
    return out;
  }

  let page, y, pageN = 0;
  function chrome(){
    // thin top accent + footer, drawn once per page as it's created
    page.ops.push(`${PDF_C.blue[0]} ${PDF_C.blue[1]} ${PDF_C.blue[2]} rg`);
    page.ops.push(`0 ${(PDF_A4.h-6).toFixed(2)} ${PDF_A4.w} 6 re f`);
    text(M, 24, `Trading Journal · Exported ${fmtDate(new Date().toISOString())} · Page ${pageN}`, {size:8, color:PDF_C.dim2});
  }
  function addPage(){
    page = doc.newPage(); pageN = page.n; y = PDF_A4.h - 60; chrome();
  }
  function ensure(h){ if(y - h < 70) addPage(); }
  function rect(x,yBottom,w,h,color){
    page.ops.push(`${color[0]} ${color[1]} ${color[2]} rg`);
    page.ops.push(`${x.toFixed(2)} ${yBottom.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
  }
  function line(x1,yy1,x2,yy2,color,lw=1){
    page.ops.push(`${color[0]} ${color[1]} ${color[2]} RG`);
    page.ops.push(`${lw} w`);
    page.ops.push(`${x1.toFixed(2)} ${yy1.toFixed(2)} m ${x2.toFixed(2)} ${yy2.toFixed(2)} l S`);
  }
  function text(x,yy,str,{size=10,bold=false,color=PDF_C.text}={}){
    const clean = pdfSanitizeText(str);
    page.ops.push(`${color[0]} ${color[1]} ${color[2]} rg`);
    page.ops.push(`BT /${bold?'F2':'F1'} ${size} Tf ${x.toFixed(2)} ${yy.toFixed(2)} Td (${pdfLiteral(clean)}) Tj ET`);
  }
  function textRight(xRight,yy,str,opts={}){
    const w = textW(pdfSanitizeText(str), opts.size||10, opts.bold);
    text(xRight-w, yy, str, opts);
  }
  function drawImageFit(dataUrl, x, yTop, maxW, maxH){
    const im = doc.addImage(dataUrl);
    let w = maxW, h = im.height/im.width*w;
    if(h > maxH){ h = maxH; w = im.width/im.height*h; }
    const yBottom = yTop - h;
    page.ops.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${yBottom.toFixed(2)} cm /${im.name} Do Q`);
    return h;
  }

  /* ---- Cover page ---- */
  addPage();
  text(M, PDF_A4.h-100, 'Trading Journal', {size:28, bold:true});
  text(M, PDF_A4.h-122, 'Performance Report', {size:13, color:PDF_C.dim});
  const period = trades.length ? `${fmtDate(trades[0].date)} — ${fmtDate(trades[trades.length-1].date)}` : '—';
  text(M, PDF_A4.h-142, `${S.profile.name} · Generated ${fmtDate(new Date().toISOString())} · ${period}`, {size:9.5, color:PDF_C.dim});
  line(M, PDF_A4.h-152, PDF_A4.w-M, PDF_A4.h-152, PDF_C.border, 1);

  const stats = [
    ['Current Balance', fmtMoney(st.currentBalance)],
    ['Net P&L', fmtMoney(st.totalPnl,true)],
    ['Win Rate', fmtPct(st.winRate)],
    ['Profit Factor', isFinite(st.profitFactor)?st.profitFactor.toFixed(2):'∞'],
    ['Total Trades', String(S.trades.length)],
    ['Avg Win / Avg Loss', `${fmtMoney(st.avgWin)} / ${fmtMoney(st.avgLoss)}`],
    ['Best Win Streak', `${st.bestWin} trade${st.bestWin===1?'':'s'}`],
    ['Worst Loss Streak', `${st.worstLoss} trade${st.worstLoss===1?'':'s'}`],
  ];
  const cardGap = 14, cardW = (W-cardGap)/2, cardH = 56;
  let sy = PDF_A4.h-186;
  stats.forEach((s,i)=>{
    const col = i%2, row = Math.floor(i/2);
    const cx = M + col*(cardW+cardGap);
    const cyTop = sy - row*(cardH+cardGap);
    rect(cx, cyTop-cardH, cardW, cardH, PDF_C.hi);
    rect(cx, cyTop-3, cardW, 3, col===0?PDF_C.blue:PDF_C.purple);
    text(cx+14, cyTop-22, s[0].toUpperCase(), {size:8, bold:true, color:PDF_C.dim});
    text(cx+14, cyTop-42, s[1], {size:16, bold:true, color:PDF_C.text});
  });
  y = sy - 4*(cardH+cardGap) - 14;

  // Monthly P&L vector bar chart
  const months = Object.values(st.byMonth).slice(-10);
  if(months.length){
    text(M, y, 'Monthly P&L', {size:13, bold:true}); y -= 8;
    line(M, y, PDF_A4.w-M, y, PDF_C.border, 1); y -= 90;
    const chartTop = y+80, chartBase = y+10, chartH = 70;
    const maxAbs = Math.max(1, ...months.map(m=>Math.abs(m.pnl)));
    const bw = Math.min(46, (W-20)/months.length - 10);
    const step = (W-20)/months.length;
    months.forEach((m,i)=>{
      const bx = M + 10 + i*step + (step-bw)/2;
      const h = Math.max(2, Math.abs(m.pnl)/maxAbs*chartH*0.85);
      const color = m.pnl>=0 ? PDF_C.blue : PDF_C.red;
      if(m.pnl>=0) rect(bx, chartBase, bw, h, color);
      else rect(bx, chartBase-h, bw, h, color);
      const lbl = m.label;
      text(bx + bw/2 - textW(lbl,7.5,false)/2, chartBase-h-(m.pnl<0?12:0)-10, lbl, {size:7.5, color:PDF_C.dim});
    });
    line(M, chartBase, PDF_A4.w-M, chartBase, PDF_C.border, 0.75);
    y = y - 12;
  }

  /* ---- Trade log ---- */
  addPage();
  text(M, y, `Trade Log — ${trades.length} trade${trades.length===1?'':'s'}`, {size:16, bold:true});
  y -= 24;

  trades.forEach((t,idx)=>{
    ensure(60);
    // left accent
    const barColor = t.status==='open'?PDF_C.dim2 : t.direction==='long'?PDF_C.blue:PDF_C.red;
    rect(M, y-2, 3, 16, barColor);
    text(M+12, y, `${idx+1}.  ${t.symbol}`, {size:12.5, bold:true});
    const dirLabel = t.direction==='long'?'LONG':'SHORT';
    const afterSymbolX = M+12+textW(`${idx+1}.  ${t.symbol}`,12.5,true);
    text(afterSymbolX+8, y, '·', {size:9, color:PDF_C.dim2});
    text(afterSymbolX+16, y, dirLabel, {size:8.5, bold:true, color: t.direction==='long'?PDF_C.blue:PDF_C.red});
    const dateStr = fmtDate(t.date) + (t.time?'  ·  '+t.time:'');
    textRight(PDF_A4.w-M, y, dateStr, {size:9, color:PDF_C.dim});
    y -= 16;
    const statusLabel = t.status==='open'?'OPEN':t.status==='breakeven'?'BREAK-EVEN':t.status.toUpperCase();
    const statusColor = t.status==='win'?PDF_C.blue:t.status==='loss'?PDF_C.red:PDF_C.dim;
    text(M+12, y, statusLabel, {size:9, bold:true, color:statusColor});
    const pnlStr = t.status==='open' ? '—' : fmtMoney(t.pnl,true);
    textRight(PDF_A4.w-M, y, pnlStr, {size:13, bold:true, color: t.status==='open'?PDF_C.dim : (t.pnl>=0?PDF_C.blue:PDF_C.red)});
    y -= 18;

    const details = [
      ['Entry', t.entry!=null?String(t.entry):'—'],
      ['Stop Loss', t.sl!=null?String(t.sl):'N/A'],
      ['Take Profit', t.tp!=null?String(t.tp):'N/A'],
      ['Exit', t.exit!=null?String(t.exit):(t.status==='open'?'Open':'N/A')],
      ['Lots', t.lots!=null?String(t.lots):'—'],
      ['R : R', t.rr!=null?String(t.rr):'—'],
    ];
    ensure(40);
    const colW = W/3;
    details.forEach((d,i)=>{
      const col = i%3, row = Math.floor(i/3);
      if(i===3){ ensure(40); } // keep the two detail rows together
      const dx = M + col*colW, dyy = y - row*24;
      text(dx, dyy, d[0].toUpperCase(), {size:7, bold:true, color:PDF_C.dim});
      text(dx, dyy-11, d[1], {size:10, color:PDF_C.text});
    });
    y -= 24*2 + 6;

    if(t.tags && t.tags.length){
      ensure(20);
      let tx = M;
      t.tags.forEach(tag=>{
        const clean = pdfSanitizeText(tag);
        const tw = textW(clean,8,true)+14;
        if(tx+tw > M+W){ tx = M; y -= 18; ensure(18); }
        rect(tx, y-11, tw, 15, PDF_C.blueDim);
        text(tx+7, y-7, clean, {size:8, bold:true, color:PDF_C.blue});
        tx += tw+6;
      });
      y -= 20;
    }

    if(t.notes && t.notes.trim()){
      ensure(20);
      text(M, y, 'NOTES', {size:7, bold:true, color:PDF_C.dim}); y -= 12;
      wrap(t.notes, W, 9.5, false).forEach(l=>{
        ensure(13);
        text(M, y, l, {size:9.5, color:PDF_C.text});
        y -= 13;
      });
      y -= 4;
    }

    if(t.bannerImage){
      ensure(30);
      const maxH = Math.min(220, y-90);
      if(maxH > 40){
        const h = drawImageFit(t.bannerImage, M, y, W, maxH);
        y -= h + 10;
      }
    }

    y -= 6;
    ensure(4);
    line(M, y, PDF_A4.w-M, y, PDF_C.border, 1);
    y -= 20;
  });

  return doc.build();
}

async function importData(e){
  const file = e.target.files[0]; if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data.profile || !Array.isArray(data.trades)) throw new Error('Invalid backup file');
    if(!confirm(`Import ${data.trades.length} trades and overwrite current data?`)) return;
    await dbClearAll();
    await dbPut('profile', data.profile);
    await dbPut('settings', data.settings || {id:1, backendUrl:'', currency:'USD'});
    for(const t of data.trades) await dbPut('trades', t);
    for(const w of (data.widgets||[])) await dbPut('widgets', w);
    toast('Data imported successfully');
    setTimeout(()=>location.reload(), 700);
  }catch(err){
    toast('Import failed: '+err.message);
  }
}

/* ---------------- Sync via code (no file, cross-device, no sign-in) ----------------
   Uses PeerJS (WebRTC) with its free public broker — no account, no API key,
   no backend of our own. This is a direct browser-to-browser transfer: nothing
   ever touches a third-party database, so there's no CORS or storage-quota
   dependency to fail. The "code" is just the ID one browser listens on; the
   other browser dials it directly. Both devices need to be online for the
   few seconds the transfer takes — after that, the code is gone. */
const SYNC_CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O/1/I to avoid mix-ups
const SYNC_ID_PREFIX = 'tj9-';
let PEERJS_LOAD_PROMISE = null;
let syncSenderPeer = null;

const PEERJS_CDN_URLS = [
  'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js',
  'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js'
];

function loadScriptOnce(src, timeoutMs){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    let done = false;
    const timer = setTimeout(()=>{
      if(done) return;
      done = true;
      s.remove();
      reject(new Error('timed out'));
    }, timeoutMs);
    s.src = src;
    s.onload = ()=>{
      if(done) return;
      done = true;
      clearTimeout(timer);
      resolve();
    };
    s.onerror = ()=>{
      if(done) return;
      done = true;
      clearTimeout(timer);
      s.remove();
      reject(new Error('failed to load'));
    };
    document.head.appendChild(s);
  });
}

function loadPeerJS(){
  if(typeof Peer !== 'undefined') return Promise.resolve();
  // Only reuse an in-flight load — never reuse a *failed* one, or every
  // later attempt (e.g. a temporary network blip) would replay the same
  // stale rejection forever without ever retrying.
  if(PEERJS_LOAD_PROMISE) return PEERJS_LOAD_PROMISE;
  PEERJS_LOAD_PROMISE = (async ()=>{
    let lastErr = null;
    for(const url of PEERJS_CDN_URLS){
      if(typeof Peer !== 'undefined') return;
      try{
        await loadScriptOnce(url, 8000);
        if(typeof Peer !== 'undefined') return;
        lastErr = new Error('script loaded but Peer is undefined');
      }catch(err){
        lastErr = err;
      }
    }
    throw new Error('Could not load the sync library — check your connection');
  })();
  // Clear the cached promise on failure so the next attempt retries fresh.
  PEERJS_LOAD_PROMISE.catch(()=>{ PEERJS_LOAD_PROMISE = null; });
  return PEERJS_LOAD_PROMISE;
}
function syncGenCode(){
  let c = '';
  for(let i=0;i<6;i++) c += SYNC_CODE_CHARS[Math.floor(Math.random()*SYNC_CODE_CHARS.length)];
  return c;
}
function syncCleanCodeInput(raw){
  return raw.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
}
function syncFormatCodeForDisplay(code){
  return code.split('').join(' ');
}
async function copyTextToClipboard(text){
  // Try the modern Clipboard API first — it can silently fail in embedded/
  // sandboxed webviews that don't grant clipboard-write permission, so we
  // fall back to the older execCommand approach via a hidden textarea.
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch{}
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.left = '-1000px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    ta.remove();
    if(ok) return true;
  }catch{}
  return false;
}
function selectTextForManualCopy(el){
  if(!el) return;
  try{
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }catch{}
}
function syncCleanupSender(){
  if(syncSenderPeer){ try{ syncSenderPeer.destroy(); }catch{} syncSenderPeer = null; }
}

async function syncGenerateCode(){
  const btn = $('#btn-sync-generate');
  const origLabel = btn.innerHTML;
  btn.innerHTML = 'Loading…'; btn.disabled = true;
  syncCleanupSender();
  try{
    await loadPeerJS();
    const payload = await buildBackupPayload();
    const json = JSON.stringify(payload);
    if(json.length > 20000000){
      toast('Data too large to sync by code — use Export/Import file instead');
      return;
    }
    const code = syncGenCode();
    const peer = new Peer(SYNC_ID_PREFIX + code.toLowerCase());
    syncSenderPeer = peer;
    let settled = false;
    let expiryTimer = null;

    openSheet(`
      <div class="sheet-handle"></div>
      <div class="sheet-title">Sync code <button class="sheet-close" id="sheet-close">${svgIcon('close')}</button></div>
      <div style="padding:4px 4px 6px;">
        <p style="font-size:12.5px;color:var(--text-dim);margin:0 0 18px;line-height:1.5;">Enter this code in <b>Settings → Receive on this device</b> on your other device — <b>keep this screen open</b> until it connects.</p>
        <div style="display:flex;justify-content:center;">
          <div id="sync-code-display" style="font-family:'Space Grotesk';font-size:34px;font-weight:700;letter-spacing:5px;background:var(--card-2,rgba(127,127,127,.08));border:1px solid var(--border);border-radius:14px;padding:20px 10px;text-align:center;width:100%;max-width:340px;">${syncFormatCodeForDisplay(code)}</div>
        </div>
        <button class="btn btn-ghost btn-block" id="btn-sync-copy" style="margin-top:14px;">${svgIcon('copy')} Copy code</button>
        <div id="sync-status" style="font-size:12px;color:var(--text-dim2);margin-top:14px;line-height:1.5;text-align:center;">Waiting for the other device…</div>
        <button class="btn btn-primary btn-block" id="btn-sync-done" style="margin-top:16px;">Cancel</button>
      </div>`);
    const statusEl = $('#sync-status');
    const cleanupAndClose = ()=>{ clearTimeout(expiryTimer); syncCleanupSender(); closeSheet(); };
    $('#sheet-close').addEventListener('click', cleanupAndClose);
    $('#btn-sync-done').addEventListener('click', cleanupAndClose);
    $('#btn-sync-copy').addEventListener('click', async ()=>{
      if(await copyTextToClipboard(code)){
        toast('Code copied');
      }else{
        selectTextForManualCopy($('#sync-code-display'));
        toast('Couldn\'t auto-copy — code is selected, use your keyboard/menu to copy');
      }
    });

    peer.on('connection', (conn)=>{
      conn.on('open', ()=>{
        conn.send(json);
        if(statusEl) statusEl.textContent = 'Connected — sending…';
        setTimeout(()=>{
          if(settled) return;
          settled = true;
          toast('Synced successfully');
          clearTimeout(expiryTimer);
          conn.close();
          syncCleanupSender();
          closeSheet();
        }, 900);
      });
    });
    peer.on('error', (err)=>{
      if(settled) return;
      settled = true;
      clearTimeout(expiryTimer);
      toast('Sync failed: '+(err.type || err.message || 'connection error')+' — try Export/Import instead');
      syncCleanupSender();
      closeSheet();
    });
    expiryTimer = setTimeout(()=>{
      if(settled) return;
      settled = true;
      toast('Code expired — generate a new one');
      syncCleanupSender();
      closeSheet();
    }, 5*60*1000);
  }catch(err){
    toast('Could not generate code: '+err.message+' — try Export/Import instead');
    syncCleanupSender();
  }finally{
    btn.innerHTML = origLabel; btn.disabled = false;
  }
}

async function syncRedeemCode(){
  const input = $('#sync-code-input');
  const code = syncCleanCodeInput(input.value);
  if(code.length < 6){ toast('Enter the code from your other device'); return; }
  const btn = $('#btn-sync-redeem');
  const origLabel = btn.textContent;
  btn.textContent = 'Connecting…'; btn.disabled = true;
  let peer = null;
  let settled = false;
  const finish = ()=>{ btn.textContent = origLabel; btn.disabled = false; };
  try{
    await loadPeerJS();
    peer = new Peer();
    const timeout = setTimeout(()=>{
      if(settled) return;
      settled = true;
      toast('Could not find that device — make sure the code is current and both devices are online');
      try{ peer.destroy(); }catch{}
      finish();
    }, 20000);

    peer.on('open', ()=>{
      const conn = peer.connect(SYNC_ID_PREFIX + code.toLowerCase(), {reliable:true});
      conn.on('data', async (json)=>{
        if(settled) return;
        settled = true;
        clearTimeout(timeout);
        try{
          const data = JSON.parse(json);
          if(!data.profile || !Array.isArray(data.trades)) throw new Error('That code sent invalid data');
          if(!confirm(`Import ${data.trades.length} trades and overwrite the data on this device?`)){
            finish(); try{ peer.destroy(); }catch{}
            return;
          }
          await dbClearAll();
          await dbPut('profile', data.profile);
          await dbPut('settings', data.settings || {id:1, backendUrl:'', currency:'USD'});
          for(const t of data.trades) await dbPut('trades', t);
          for(const w of (data.widgets||[])) await dbPut('widgets', w);
          input.value = '';
          toast('Synced successfully');
          try{ conn.close(); peer.destroy(); }catch{}
          setTimeout(()=>location.reload(), 700);
        }catch(err){
          toast('Sync failed: '+err.message+' — try Export/Import instead');
          finish(); try{ peer.destroy(); }catch{}
        }
      });
      conn.on('error', (err)=>{
        if(settled) return;
        settled = true;
        clearTimeout(timeout);
        toast('Sync failed: '+(err.type || err.message || 'connection error')+' — try Export/Import instead');
        finish(); try{ peer.destroy(); }catch{}
      });
    });
    peer.on('error', (err)=>{
      if(settled) return;
      settled = true;
      clearTimeout(timeout);
      if(err.type === 'peer-unavailable'){
        toast('Code not found or already used');
      }else{
        toast('Sync failed: '+(err.type || err.message || 'connection error')+' — try Export/Import instead');
      }
      finish(); try{ peer.destroy(); }catch{}
    });
  }catch(err){
    toast('Could not start sync: '+err.message+' — try Export/Import instead');
    finish();
  }
}
</script>
</body>
</html>
